<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><rect width="1200" height="780" fill="#fff"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="42" y="48" font-size="30" fill="#223249" font-weight="700" text-anchor="start">活动全屏适配：两种可复用的布局策略</text><text x="42" y="82" font-size="17" fill="#63738a" font-weight="400" text-anchor="start">结构示意 · 参数来自39781代码 · 图形为实现说明，不是游戏实拍</text><text x="42" y="131" font-size="23" fill="#207d71" font-weight="700" text-anchor="start">Ancient｜主构图整体按高度适配</text><rect x="42" y="157" width="250" height="422" rx="14" fill="#f5f8fb" stroke="#c5d0dd" stroke-width="2"/><rect x="62" y="175" width="210" height="382" rx="7" fill="#e3f1ed" stroke="#207d71" stroke-width="2"/><rect x="79" y="194" width="176" height="51" rx="5" fill="#207d71" stroke="none" stroke-width="2"/><text x="167" y="226" font-size="18" fill="white" font-weight="600" text-anchor="middle">标题与进度</text><ellipse cx="189" cy="290" rx="27" ry="10" fill="#dcae48"/><text x="189" y="295" font-size="14" fill="#493b22" font-weight="600" text-anchor="middle">5</text><ellipse cx="145" cy="338" rx="27" ry="10" fill="#dcae48"/><text x="145" y="343" font-size="14" fill="#493b22" font-weight="600" text-anchor="middle">4</text><ellipse cx="189" cy="386" rx="27" ry="10" fill="#dcae48"/><text x="189" y="391" font-size="14" fill="#493b22" font-weight="600" text-anchor="middle">3</text><ellipse cx="145" cy="434" rx="27" ry="10" fill="#dcae48"/><text x="145" y="439" font-size="14" fill="#493b22" font-weight="600" text-anchor="middle">2</text><ellipse cx="189" cy="482" rx="27" ry="10" fill="#dcae48"/><text x="189" y="487" font-size="14" fill="#493b22" font-weight="600" text-anchor="middle">1</text><text x="167" y="547" font-size="14" fill="#207d71" font-weight="600" text-anchor="middle">底边参考点</text><path d="M48,559 L286,559" fill="none" stroke="#207d71" stroke-width="2" stroke-dasharray="6 5"/><text x="317" y="211" font-size="20" fill="#223249" font-weight="700" text-anchor="start">统一缩放组</text><text x="317" y="248" font-size="16" fill="#223249" font-weight="400" text-anchor="start">标题、门、台子按比例变化</text><text x="317" y="283" font-size="17" fill="#223249" font-weight="400" text-anchor="start">S = 相机高度 ÷ 设计高度</text><text x="317" y="318" font-size="17" fill="#223249" font-weight="400" text-anchor="start">底边参考点 → 相机底部</text><text x="317" y="379" font-size="20" fill="#223249" font-weight="700" text-anchor="start">极长屏局部修正</text><text x="317" y="416" font-size="18" fill="#223249" font-weight="400" text-anchor="start">标题 × 0.92</text><text x="317" y="451" font-size="17" fill="#223249" font-weight="400" text-anchor="start">Stage / Levels 向内收</text><text x="317" y="486" font-size="16" fill="#223249" font-weight="400" text-anchor="start">两侧装饰可裁切，水面补宽</text><text x="622" y="131" font-size="23" fill="#b7522b" font-weight="700" text-anchor="start">Lava｜顶部独立，场景按剩余高度适配</text><rect x="622" y="157" width="250" height="422" rx="14" fill="#f5f8fb" stroke="#c5d0dd" stroke-width="2"/><rect x="638" y="175" width="218" height="105" rx="6" fill="#fce9dc" stroke="#b7522b" stroke-width="2"/><text x="747" y="210" font-size="17" fill="#8b4225" font-weight="600" text-anchor="middle">标题 / 倒计时</text><text x="747" y="241" font-size="16" fill="#8b4225" font-weight="600" text-anchor="middle">Levels / Players</text><path d="M629,292 L865,292" fill="none" stroke="#b7522b" stroke-width="2" stroke-dasharray="6 5"/><rect x="655" y="316" width="184" height="241" rx="6" fill="#e9eef5" stroke="#6a7893" stroke-width="2"/><ellipse cx="777" cy="337" rx="22" ry="8" fill="#7f6872"/><ellipse cx="717" cy="368" rx="22" ry="8" fill="#7f6872"/><ellipse cx="777" cy="399" rx="22" ry="8" fill="#7f6872"/><ellipse cx="717" cy="430" rx="22" ry="8" fill="#7f6872"/><ellipse cx="777" cy="461" rx="22" ry="8" fill="#7f6872"/><ellipse cx="717" cy="492" rx="22" ry="8" fill="#7f6872"/><ellipse cx="777" cy="523" rx="22" ry="8" fill="#7f6872"/><path d="M628,559 L866,559" fill="none" stroke="#6a7893" stroke-width="2" stroke-dasharray="6 5"/><text x="897" y="211" font-size="20" fill="#223249" font-weight="700" text-anchor="start">先保留顶部空间</text><text x="897" y="248" font-size="16" fill="#223249" font-weight="400" text-anchor="start">安全区顶边向下安排Header</text><text x="897" y="283" font-size="17" fill="#223249" font-weight="400" text-anchor="start">预留高度：5.7 × UI倍率</text><text x="897" y="353" font-size="20" fill="#223249" font-weight="700" text-anchor="start">下方场景单独缩放</text><text x="897" y="390" font-size="17" fill="#223249" font-weight="400" text-anchor="start">放得下 → 保持原尺寸</text><text x="897" y="425" font-size="17" fill="#223249" font-weight="400" text-anchor="start">放不下 → 等比缩小并贴底</text><text x="897" y="460" font-size="17" fill="#223249" font-weight="400" text-anchor="start">达到最小倍率 → 顶部校正</text><text x="897" y="495" font-size="17" fill="#b7522b" font-weight="400" text-anchor="start">不能继续无限缩小</text><path d="M42,618 L1158,618" fill="none" stroke="#d7e0e9" stroke-width="2"/><text x="42" y="658" font-size="21" fill="#223249" font-weight="700" text-anchor="start">共同实现原则</text><text x="42" y="697" font-size="19" fill="#223249" font-weight="400" text-anchor="start">布局层负责整体位置与缩放；动画层负责跳跃、落地、下沉。二者不要反复改写同一个Transform。</text><text x="42" y="738" font-size="19" fill="#223249" font-weight="400" text-anchor="start">每次从初始基准重算，并同步点击区域。场景边界标记用于适配，不等于台子数量或头像数量。</text></g></svg>