<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关卡数据集成工具</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
/* ============================================================
   CSS Variables — 三工具统一主题
   ============================================================ */
:root {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --border: #e2e6ed;
  --text: #1a1d23;
  --text-2: #6b7280;
  --text-3: #9ca3af;
  --blue: #4f6ef7;
  --blue-light: #eef2ff;
  --green: #10b981;
  --green-light: #d1fae5;
  --amber: #f59e0b;
  --red: #ef4444;
  --purple: #a855f7;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ============================================================
   Topbar
   ============================================================ */
.topbar {
  background: #1a1d23;
  height: 52px;
  display: flex;
  align-items: center;
  padding: 0 32px;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-brand { font-size: 14px; font-weight: 600; color: #fff; }
.topbar-brand em { color: #6c8ef5; font-style: normal; }
.topbar-divider { width: 1px; height: 18px; background: #333; }
.topbar-hint { font-size: 12px; color: #6b7280; }

/* ============================================================
   Stage 0 — Upload Area
   ============================================================ */
.stage { max-width: 1280px; margin: 0 auto; padding: 24px 20px; }
.stage-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

.upload-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}
.upload-zone {
  border: 2px dashed #c7d2fe;
  border-radius: 14px;
  background: var(--surface);
  padding: 32px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  position: relative;
}
.upload-zone:hover { border-color: var(--blue); background: var(--blue-light); }
.upload-zone.loaded { border-color: var(--green); background: var(--green-light); }
.uz-label {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
  position: absolute;
  top: 10px;
  right: 10px;
}
.uz-label.v1 { background: var(--blue-light); color: var(--blue); }
.uz-label.v2 { background: var(--green-light); color: #065f46; }
.uz-icon { font-size: 28px; }
.uz-name { font-size: 13px; font-weight: 600; }
.uz-status { font-size: 11px; color: var(--text-3); }
.uz-file { font-size: 11px; color: var(--text-2); margin-top: 4px; }

.upload-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
}
.btn {
  border: none;
  border-radius: 10px;
  padding: 11px 28px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .15s;
}
.btn:hover { opacity: .88; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-outline { background: var(--surface); color: var(--text-2); border: 1px solid var(--border); }

/* ============================================================
   Stage 1 — Settings Panel
   ============================================================ */
.settings-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px 24px;
  margin-top: 16px;
}
.settings-section { margin-bottom: 18px; }
.settings-section:last-child { margin-bottom: 0; }
.settings-section-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 10px;
}
.metric-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 10px;
}
.metric-card {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg);
  border-radius: 10px;
  padding: 10px 14px;
  border: 1px solid var(--border);
}
.metric-name { font-size: 13px; font-weight: 600; flex: 1; min-width: 0; }
.dir-btn {
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 6px;
  padding: 3px 10px;
  font-size: 12px;
  cursor: pointer;
  min-width: 28px;
  text-align: center;
  transition: .15s;
}
.dir-btn.up { color: var(--green); }
.dir-btn.up.active { background: var(--green); color: #fff; border-color: var(--green); }
.dir-btn.down { color: var(--red); }
.dir-btn.down.active { background: var(--red); color: #fff; border-color: var(--red); }
.metric-weight { display: flex; align-items: center; gap: 6px; }
.metric-weight input[type=range] { width: 100px; accent-color: var(--blue); }
.metric-weight-num {
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
  width: 48px;
  text-align: center;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 4px;
  background: var(--bg);
  outline: none;
}
.metric-weight-num:focus { border-color: var(--blue); background: #fff; }

.threshold-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; }
.field input {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
  outline: none;
  transition: border-color .15s;
}
.field input:focus { border-color: var(--blue); background: #fff; }

/* ============================================================
   Stage 2 — Mode Selector
   ============================================================ */
.mode-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 20px 0;
}
.mode-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 28px 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, box-shadow .2s;
}
.mode-card:hover { border-color: var(--blue); box-shadow: 0 2px 12px rgba(79,110,247,.12); }
.mode-card.active { border-color: var(--blue); background: var(--blue-light); }
.mode-card-icon { font-size: 32px; margin-bottom: 10px; }
.mode-card-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.mode-card-desc { font-size: 12px; color: var(--text-3); line-height: 1.5; }

/* ============================================================
   Stage 3 — Results Area
   ============================================================ */
.result-wrap { display: none; }
.result-wrap.show { display: block; }

/* --- Summary Cards --- */
.summary-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 16px;
}
.summary-card {
  background: var(--surface);
  border-radius: 12px;
  border: 1px solid var(--border);
  padding: 16px 20px;
}
.summary-card h3 { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.summary-card .stats { font-size: 11px; color: var(--text-2); line-height: 1.6; }
.summary-card .big-num { font-size: 28px; font-weight: 800; }

/* --- Toolbar --- */
.toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 12px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.toolbar select, .toolbar input {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 12px;
  outline: none;
}
.toolbar select:focus, .toolbar input:focus { border-color: var(--blue); }
.toolbar-info { font-size: 11px; color: var(--text-3); margin-left: auto; }

/* --- Table --- */
.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  overflow-x: auto;
}
.table-wrap table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}
.table-wrap th {
  background: var(--bg);
  padding: 10px 12px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .5px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
.table-wrap th.r { text-align: right; }
.table-wrap td {
  padding: 10px 12px;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.table-wrap td.r { text-align: right; }
.table-wrap tr:last-child td { border-bottom: none; }
.table-wrap tr:hover td { background: var(--blue-light); }

/* --- Chips & Badges --- */
.chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  margin: 1px 2px;
}
.ch-red { background: #fee2e2; color: #991b1b; }
.ch-amber { background: #fef3c7; color: #92400e; }
.ch-green { background: var(--green-light); color: #065f46; }
.ch-purple { background: #f3e8ff; color: #6b21a8; }
.ch-blue { background: var(--blue-light); color: #3730a3; }

/* Score colors */
.c-red { color: var(--red); }
.c-amber { color: var(--amber); }
.c-green { color: var(--green); }

/* --- Footbar --- */
.footbar {
  margin-top: 16px;
  font-size: 11px;
  color: var(--text-3);
  line-height: 1.7;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 20px;
}

/* --- Candidate tags (替换模式) --- */
.candidate {
  display: inline-block;
  margin: 2px 3px;
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 11px;
  background: #fff;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: .15s;
}
.candidate:hover { border-color: var(--blue); }
.candidate.best { border-color: var(--blue); background: var(--blue-light); }
.candidate.sel { border-color: var(--green); background: var(--green-light); }
.candidate small { color: var(--text-3); margin-left: 4px; }

.action-btn {
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 6px;
  padding: 4px 12px;
  font-size: 11px;
  cursor: pointer;
  margin: 1px 2px;
}
.action-btn.rp { color: var(--green); border-color: var(--green); }
.action-btn.rp:hover { background: var(--green); color: #fff; }
.action-btn.sk { color: var(--amber); border-color: var(--amber); }
.action-btn.sk:hover { background: var(--amber); color: #fff; }

/* ============================================================
   Loading Overlay
   ============================================================ */
.loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(240,242,245,.85);
  z-index: 200;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  gap: 16px;
}
.loading-overlay.show { display: flex; }
.loading-spinner {
  width: 40px;
  height: 40px;
  border: 4px solid var(--border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: var(--text-2); font-weight: 600; }

/* ============================================================
   Analysis Mode — Dashboard
   ============================================================ */
.insight-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  margin-bottom: 16px;
}
.insight-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
}
.insight-card .ins-title { font-size: 12px; font-weight: 700; margin-bottom: 8px; }
.insight-card .ins-text { font-size: 12px; color: var(--text-2); line-height: 1.6; }
.ins-chips { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px; }
.ins-chip {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}
.ins-chip.amber { background: #fef3c7; color: #92400e; }
.ins-chip.blue { background: var(--blue-light); color: #3730a3; }
.ins-chip.red { background: #fee2e2; color: #991b1b; }
.ins-chip.green { background: var(--green-light); color: #065f46; }

.lv-tag { font-size: 12px; font-weight: 600; color: var(--blue); }

/* ============================================================
   Pagination
   ============================================================ */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  padding: 16px;
  font-size: 13px;
}
.pagination button {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 8px;
  padding: 6px 16px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: .15s;
}
.pagination button:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.pagination button:disabled { opacity: .35; cursor: not-allowed; }
.pagination .page-info { color: var(--text-2); font-size: 12px; }

/* Sortable headers */
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--blue); }
th .sort-arrow { font-size: 10px; margin-left: 2px; opacity: .4; }
th .sort-arrow.active { opacity: 1; color: var(--blue); }
</style>
</head>
<body>

<!-- ============================================================
     Topbar
     ============================================================ -->
<div class="topbar">
  <div class="topbar-brand">关卡数据<em>集成工具</em></div>
  <div class="topbar-divider"></div>
  <div class="topbar-hint" id="topbar-hint">上传数据开始使用</div>
</div>

<!-- ============================================================
     Stage 0 — Upload
     ============================================================ -->
<div class="stage" id="stage-upload">
  <div class="stage-title">📂 上传数据</div>

  <div class="upload-grid">
    <!-- File 1 -->
    <div class="upload-zone" id="zone-1" onclick="document.getElementById('file-1').click()">
      <span class="uz-label v1">A 集</span>
      <div class="uz-icon" id="icon-1">📋</div>
      <div class="uz-name" id="name-1">主数据文件</div>
      <div class="uz-status" id="stat-1">点击或拖拽上传 Excel</div>
      <div class="uz-file" id="file-1-name"></div>
    </div>

    <!-- File 2 -->
    <div class="upload-zone" id="zone-2" onclick="document.getElementById('file-2').click()">
      <span class="uz-label v2">B 集</span>
      <div class="uz-icon" id="icon-2">📋</div>
      <div class="uz-name" id="name-2">对比参照文件（可选）</div>
      <div class="uz-status" id="stat-2">点击或拖拽上传 Excel</div>
      <div class="uz-file" id="file-2-name"></div>
    </div>
  </div>

  <input type="file" id="file-1" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleFile(this,0)">
  <input type="file" id="file-2" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleFile(this,1)">

  <!-- Mode Selector (always visible) -->
  <div class="stage-title" style="margin-top:20px">🎛️ 选择功能</div>
  <div class="mode-selector">
    <div class="mode-card" id="mode-analysis" onclick="pickMode('analysis')">
      <div class="mode-card-icon">🔍</div>
      <div class="mode-card-title">分析诊断</div>
      <div class="mode-card-desc">单文件深度分析<br>仪表盘 · 洞察 · 排名</div>
    </div>
    <div class="mode-card" id="mode-compare" onclick="pickMode('compare')">
      <div class="mode-card-icon">📊</div>
      <div class="mode-card-title">版本对比</div>
      <div class="mode-card-desc" id="mode-compare-desc">双版本差异对比<br>需上传两个文件</div>
    </div>
    <div class="mode-card" id="mode-replace" onclick="pickMode('replace')">
      <div class="mode-card-icon">🔄</div>
      <div class="mode-card-title">替换对照</div>
      <div class="mode-card-desc" id="mode-replace-desc">候选匹配 · 替换操作<br>需上传两个文件</div>
    </div>
  </div>

  <div class="upload-actions">
    <button class="btn btn-primary" id="load-btn" disabled onclick="loadAndAnalyze()">🔍 加载并分析</button>
    <button class="btn btn-outline" id="clear-btn" onclick="clearAll()">清除缓存</button>
    <span id="load-hint" style="font-size:11px;color:var(--text-3);margin-left:12px">上传文件并选择功能</span>
  </div>
</div>

<!-- Analysis source selector (shown after load, only with 2 files in analysis mode) -->
<div id="analysis-source" style="display:none;margin-bottom:16px;max-width:1280px;margin-left:auto;margin-right:auto;padding:0 20px">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;">
    <span style="font-size:12px;font-weight:600;margin-right:12px;">分析对象：</span>
    <button class="btn" id="src-btn-0" style="padding:6px 16px;font-size:12px;" onclick="switchAnalysisSource(0)">A 集</button>
    <button class="btn" id="src-btn-1" style="padding:6px 16px;font-size:12px;margin-left:8px;" onclick="switchAnalysisSource(1)">B 集</button>
  </div>
</div>

<!-- ============================================================
     Settings (hidden initially, shown after load)
     ============================================================ -->
<div class="stage" id="stage-settings" style="display:none">
  <div class="settings-wrap">
    <!-- Weights -->
    <div class="settings-section">
      <div class="settings-section-title">⚖️ 评分权重</div>
      <div class="metric-grid" id="weight-panel"></div>
      <div class="weight-sum" id="weight-sum" style="text-align:right;margin-top:8px;font-size:11px;color:var(--text-3)">合计：0%</div>
    </div>

    <!-- Thresholds -->
    <div class="settings-section">
      <div class="settings-section-title">🎯 诊断阈值</div>
      <div class="threshold-grid" id="threshold-panel"></div>
    </div>
  </div>
</div>


<!-- ============================================================
     Stage 3 — Results Area (dynamic content)
     ============================================================ -->
<div class="stage" id="stage-result" style="display:none">
  <div class="result-wrap" id="result-wrap"></div>
</div>

<!-- ============================================================
     Loading Overlay
     ============================================================ -->
<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">正在分析...</div>
</div>

<!-- ============================================================
     SCRIPTS
     ============================================================ -->

<!-- ─── Shared Utils ─── -->
<script>
// ─── Global State ───
var datasets = [null, null];     // datasets[0] = A集, datasets[1] = B集
var scores = [null, null];       // scores[0] = A集评分, scores[1] = B集评分
var files = [null, null];        // file names
var currentMode = null;          // 'analysis' | 'compare' | 'replace'
var analysisSource = 0;          // 分析模式下当前查看的数据集索引
var repl = {};                   // 替换状态 { lv: {status:'pending'|'done'|'skip', bLv:null|number} }
var hasTwoFiles = false;         // 是否有两个文件都上传了

// ─── Default Weights ───
var weights = [
  { name:'流失率', dir:'down', w:40 },
  { name:'体验方差', dir:'down', w:25 },
  { name:'难度', dir:'down', w:15 },
  { name:'人均消耗', dir:'up', w:10 },
  { name:'复活转化', dir:'up', w:5 },
  { name:'剩余率', dir:'down', w:5 }
];

// ─── Default Thresholds ───
var thresholds = {
  turnover: 1.5,
  difficulty: 3.0,
  variance: 1.2,
  consume: 200,
  revive: 15,
  remain: 0.44
};

// ─── Column finders ───
function findCol(d, cl) {
  var ks = Object.keys(d[0] || {});
  for (var i = 0; i < cl.length; i++) if (ks.indexOf(cl[i]) >= 0) return cl[i];
  return cl[0];
}
function findLevelCol(d) {
  var ks = Object.keys(d[0] || {});
  var cand = ['Level', 'LevelID'];
  for (var i = 0; i < cand.length; i++) if (ks.indexOf(cand[i]) >= 0) return cand[i];
  return null;
}
function sv(d, k) {
  var v = d[k];
  return v !== undefined && v !== null && v !== '' && !isNaN(v) ? v : null;
}
function autoDir(name) {
  var l = name.toLowerCase();
  if (l.indexOf('流失') >= 0 || l.indexOf('变异') >= 0 || l.indexOf('难度') >= 0 ||
      l.indexOf('死局') >= 0 || l.indexOf('退出') >= 0 || l.indexOf('剩余') >= 0) return 'down';
  return 'up';
}

// ─── Scoring Engine ───
function scoreDataset(ds, wts, ths) {
  var mt = ths.turnover, md = ths.difficulty, mv = ths.variance;
  var mc = ths.consume, mr = ths.revive / 100, mm = ths.remain;

  var lc = findLevelCol(ds);
  var tC = findCol(ds, ['关内流失率(%)', '关内流失率']);
  var vC = findCol(ds, ['难度变异系数(关内)', '难度变异系数']);
  var dC = findCol(ds, ['难度']);
  var cC = findCol(ds, ['人均消耗']);
  var rC = findCol(ds, ['复活转化率']);
  var mC = findCol(ds, ['首次失败剩余率']);

  var cols = [tC, vC, dC, cC, rC, mC];
  var norms = cols.map(function(c) {
    var vs = ds.map(function(d) { return sv(d, c); }).filter(function(v) { return v !== null; });
    return vs.length ? { mn: Math.min.apply(null, vs), mx: Math.max.apply(null, vs) } : { mn: 0, mx: 1 };
  });

  return ds.map(function(d) {
    var lv = parseInt(d[lc]) || 0;
    var tu = sv(d, tC), va = sv(d, vC), di = sv(d, dC) || 1;
    var co = sv(d, cC), re = sv(d, rC), rm = sv(d, mC);
    var ql = d['关卡数据质量标签'] || '';

    var ann = [];
    if (tu > mt) ann.push({ t: 'turnover', l: '流失' + tu.toFixed(2) + '%' });
    if (di > md) ann.push({ t: 'difficulty', l: '偏难' + di.toFixed(2) });
    if (va > mv) ann.push({ t: 'variance', l: '方差' + va.toFixed(2) });
    if (co !== null && co < mc) ann.push({ t: 'consume', l: '消耗低' });
    if (re !== null && re < mr) ann.push({ t: 'revive', l: '复活低' });
    if (rm !== null && rm > mm) ann.push({ t: 'remain', l: '剩余率' });

    var raw = [tu, va, di, co, re, rm], sc = 0, tw = 0;
    wts.forEach(function(m, i) {
      var v = raw[i];
      if (v === null) return;
      var n = norms[i];
      if (n.mx === n.mn) return;
      var nm = (v - n.mn) / (n.mx - n.mn);
      if (m.dir === 'down') nm = 1 - nm;
      sc += nm * m.w;
      tw += m.w;
    });
    var score = tw > 0 ? Math.round(sc / tw * 100) : 50;

    return { lv: lv, tu: tu, va: va, di: di, co: co, re: re, rm: rm, ann: ann, score: score, ql: ql };
  });
}

// ─── Storage ───
var STORAGE_KEY = 'tilematch_integrated_tool_v1';

function saveState() {
  try {
    var state = {
      weights: weights,
      thresholds: thresholds,
      hasTwoFiles: hasTwoFiles,
      repl: repl,
      currentMode: currentMode,
      analysisSource: analysisSource,
      files: files
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) { /* quota exceeded, ignore */ }
}

function restoreState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    var state = JSON.parse(raw);
    if (state.weights) weights = state.weights;
    if (state.thresholds) thresholds = state.thresholds;
    if (state.files) files = state.files;
    if (state.repl) repl = state.repl;
    if (state.currentMode) currentMode = state.currentMode;
    if (state.analysisSource !== undefined) analysisSource = state.analysisSource;
    if (state.hasTwoFiles !== undefined) hasTwoFiles = state.hasTwoFiles;
    return true;
  } catch(e) { return false; }
}

// ─── CSV Export ───
function exportCSV(rows, filename) {
  var csv = rows.map(function(r) {
    return r.map(function(c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename || 'export.csv';
  a.click();
}

// ─── Misc ───
function showLoading(msg) {
  document.getElementById('loading-text').textContent = msg || '正在分析...';
  document.getElementById('loading').classList.add('show');
}
function hideLoading() {
  document.getElementById('loading').classList.remove('show');
}
</script>

<!-- ─── Upload Engine ─── -->
<script>
// ─── File Handling ───
function handleFile(input, idx) {
  var file = input.files[0];
  if (!file) return;

  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var wb = XLSX.read(e.target.result, { type: 'array' });
      var ws = wb.Sheets[wb.SheetNames[0]];
      var parsed = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

      if (parsed.length < 2) { alert('文件为空或格式不对（至少须含表头+数据行）'); return; }

      // Header row → keys
      var headers = parsed[0];
      var data = [];
      for (var i = 1; i < parsed.length; i++) {
        var row = {};
        var hasContent = false;
        for (var j = 0; j < headers.length; j++) {
          var h = String(headers[j] || '').trim();
          var v = parsed[i][j];
          if (v !== '' && v !== null && v !== undefined) hasContent = true;
          row[h] = v;
        }
        // Skip completely empty rows
        if (!hasContent) continue;
        // Skip rows where Level is empty
        var lc = findLevelCol([row]);
        if (lc && !row[lc] && row[lc] !== 0) continue;
        data.push(row);
      }

      datasets[idx] = data;
      files[idx] = file.name;

      // Update UI
      document.getElementById('zone-' + (idx+1)).classList.add('loaded');
      document.getElementById('icon-' + (idx+1)).textContent = '\u2705';
      document.getElementById('stat-' + (idx+1)).textContent = '\u2713 ' + data.length + ' \u884c';
      document.getElementById('file-' + (idx+1) + '-name').textContent = file.name;

      checkUploadReady();
    } catch(err) {
      alert('\u89e3\u6790\u5931\u8d25: ' + err.message + '\n\u8bf7\u786e\u8ba4\u6587\u4ef6\u683c\u5f0f\u6b63\u786e');
      datasets[idx] = null;
    }
  };
  reader.readAsArrayBuffer(file);
}

function checkUploadReady() {
  var has1 = datasets[0] !== null;
  var has2 = datasets[1] !== null;
  var mode = currentMode;
  var btn = document.getElementById('load-btn');
  var hint = document.getElementById('load-hint');
  var ok = has1 && mode;
  btn.disabled = !ok;
  if (ok) {
    var label = '\uD83D\uDD0D \u52a0\u8f7d\u5e76\u5206\u6790\uff08' + modeLabels[mode] + '\uff09';
    btn.textContent = label;
    hint.textContent = datasets[0].length + ' \u5173' + (has2 ? ' + ' + datasets[1].length + ' \u5173' : '');
  } else {
    btn.textContent = '\uD83D\uDD0D \u52a0\u8f7d\u5e76\u5206\u6790';
    if (!has1) hint.textContent = '\u4e0a\u4f20\u6587\u4ef6\u5e76\u9009\u62e9\u529f\u80fd';
    else if (!mode) hint.textContent = '\u8bf7\u9009\u62e9\u529f\u80fd';
  }
}

var modeLabels = { analysis: '\u5206\u6790\u8bca\u65ad', compare: '\u7248\u672c\u5bf9\u6bd4', replace: '\u66ff\u6362\u5bf9\u7167' };

function pickMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-card').forEach(function(c) { c.classList.remove('active'); });
  document.getElementById('mode-' + mode).classList.add('active');
  checkUploadReady();
  saveState();
}

function updateModeCards() {
  hasTwoFiles = datasets[0] !== null && datasets[1] !== null;
  document.getElementById('mode-compare-desc').textContent = hasTwoFiles ?
    '\u53cc\u7248\u672c\u5dee\u5f02\u5bf9\u6bd4' : '\u53cc\u7248\u672c\u5dee\u5f02\u5bf9\u6bd4\n\u9700\u4e0a\u4f20\u4e24\u4e2a\u6587\u4ef6';
  document.getElementById('mode-replace-desc').textContent = hasTwoFiles ?
    '\u5019\u9009\u5339\u914d \u00b7 \u66ff\u6362\u64cd\u4f5c' : '\u5019\u9009\u5339\u914d \u00b7 \u66ff\u6362\u64cd\u4f5c\n\u9700\u4e0a\u4f20\u4e24\u4e2a\u6587\u4ef6';
  checkUploadReady();
}

// ─── Load & Analyze ───
function loadAndAnalyze() {
  if (!datasets[0]) { alert('\u8bf7\u5148\u4e0a\u4f20\u4e3b\u6570\u636e\u6587\u4ef6'); return; }
  if (!currentMode) { alert('\u8bf7\u5148\u9009\u62e9\u529f\u80fd\uff08\u5206\u6790/\u5bf9\u6bd4/\u66ff\u6362\uff09'); return; }
  if ((currentMode === 'compare' || currentMode === 'replace') && !datasets[1]) {
    alert(modeLabels[currentMode] + '\u6a21\u5f0f\u9700\u8981\u4e24\u4e2a\u6587\u4ef6\uff0c\u8bf7\u4e0a\u4f20 B \u96c6\uff08\u5bf9\u7167\u53c2\u7167\u6587\u4ef6\uff09');
    return;
  }

  showLoading('\u6b63\u5728\u8bc4\u5206...');
  setTimeout(function() {
    try {
      scores[0] = scoreDataset(datasets[0], weights, thresholds);
      if (datasets[1]) scores[1] = scoreDataset(datasets[1], weights, thresholds);

      document.getElementById('stage-settings').style.display = 'block';
      renderWeightPanel();
      renderThresholdPanel();

      // Rebind mode cards to run mode on click (post-load behavior)
      ['analysis','compare','replace'].forEach(function(m) {
        document.getElementById('mode-' + m).onclick = function() { selectMode(m); };
      });

      var hint = '\u5df2\u52a0\u8f7d ' + datasets[0].length + ' \u5173';
      if (datasets[1]) hint += ' + ' + datasets[1].length + ' \u5173\uff08\u5bf9\u7167\uff09';
      hint += ' \u00b7 ' + modeLabels[currentMode];
      document.getElementById('topbar-hint').textContent = hint;

      runMode();
      hideLoading();
      saveState();
    } catch(e) {
      hideLoading();
      alert('\u5206\u6790\u51fa\u9519: ' + e.message);
    }
  }, 50);
}

function runMode() {
  document.getElementById('stage-result').style.display = 'block';
  // Show/hide analysis source selector
  var srcDiv = document.getElementById('analysis-source');
  if (currentMode === 'analysis' && hasTwoFiles) {
    srcDiv.style.display = 'block';
    switchAnalysisSource(analysisSource);
  } else {
    srcDiv.style.display = 'none';
  }
  try {
    if (currentMode === 'analysis') renderAnalysis();
    else if (currentMode === 'compare') renderCompare();
    else if (currentMode === 'replace') renderReplace();
    else document.getElementById('result-wrap').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-3)">未知模式: ' + currentMode + '</div>';
  } catch(e) {
    console.error('Render error for mode ' + currentMode + ':', e);
    document.getElementById('result-wrap').innerHTML = '<div style="text-align:center;padding:40px;color:var(--red)">渲染出错: ' + e.message + '<br><small>模式: ' + currentMode + '</small></div>';
  }
}

function selectMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-card').forEach(function(c) { c.classList.remove('active'); });
  document.getElementById('mode-' + mode).classList.add('active');
  runMode();
  saveState();
}

// ─── Clear All ───
function clearAll() {
  datasets = [null, null];
  scores = [null, null];
  files = [null, null];
  currentMode = null;
  analysisSource = 0;
  repl = {};
  hasTwoFiles = false;

  for (var i = 1; i <= 2; i++) {
    document.getElementById('zone-' + i).classList.remove('loaded');
    document.getElementById('icon-' + i).textContent = '\uD83D\uDCCB';
    document.getElementById('stat-' + i).textContent = i === 2 ? '\u70b9\u51fb\u6216\u62d6\u62fd\u4e0a\u4f20 Excel' : '\u70b9\u51fb\u6216\u62d6\u62fd\u4e0a\u4f20 Excel';
    document.getElementById('file-' + i + '-name').textContent = '';
  }
  document.getElementById('file-1').value = '';
  document.getElementById('file-2').value = '';
  document.getElementById('load-btn').disabled = true;
  document.getElementById('load-btn').textContent = '\uD83D\uDD0D \u52a0\u8f7d\u5e76\u5206\u6790';
  document.getElementById('load-hint').textContent = '\u4e0a\u4f20\u6587\u4ef6\u5e76\u9009\u62e9\u529f\u80fd';
  document.getElementById('topbar-hint').textContent = '\u4e0a\u4f20\u6570\u636e\u5f00\u59cb\u4f7f\u7528';
  document.getElementById('stage-settings').style.display = 'none';
  document.getElementById('stage-result').style.display = 'none';
  document.getElementById('result-wrap').innerHTML = '';
  document.getElementById('result-wrap').classList.remove('show');
  document.getElementById('analysis-source').style.display = 'none';

  document.querySelectorAll('.mode-card').forEach(function(c) { c.classList.remove('active'); });
  // Rebind to pickMode (pre-load behavior)
  ['analysis','compare','replace'].forEach(function(m) {
    document.getElementById('mode-' + m).onclick = function() { pickMode(m); };
  });
  updateModeCards();

  localStorage.removeItem(STORAGE_KEY);
}

function switchAnalysisSource(idx) {
  analysisSource = idx;
  document.getElementById('src-btn-0').className = idx === 0 ? 'btn btn-primary' : 'btn btn-outline';
  document.getElementById('src-btn-1').className = idx === 1 ? 'btn btn-primary' : 'btn btn-outline';
  if (currentMode === 'analysis') renderAnalysis();
  saveState();
}

// ─── Drag & Drop ───
['zone-1', 'zone-2'].forEach(function(id) {
  var zone = document.getElementById(id);
  var idx = id === 'zone-1' ? 0 : 1;

  zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.style.borderColor = 'var(--blue)'; });
  zone.addEventListener('dragleave', function(e) { zone.style.borderColor = ''; });
  zone.addEventListener('drop', function(e) {
    e.preventDefault();
    zone.style.borderColor = '';
    var file = e.dataTransfer.files[0];
    if (!file) return;
    var input = idx === 0 ? document.getElementById('file-1') : document.getElementById('file-2');
    // Need to set the file to input for handleFile to read it
    var dt = new DataTransfer();
    dt.items.add(file);
    input.files = dt.files;
    handleFile(input, idx);
  });
});

// ─── Init ───
(function init() {
  if (restoreState()) {
    renderWeightPanel();
    renderThresholdPanel();
    document.getElementById('stage-settings').style.display = 'block';
    document.getElementById('topbar-hint').textContent = '\u5df2\u6062\u590d\u4e0a\u6b21\u8bbe\u7f6e\uff08\u6570\u636e\u672a\u52a0\u8f7d\uff09';
  }
})();
</script>

<!-- ─── Settings Panel ─── -->
<script>
function renderWeightPanel() {
  var panel = document.getElementById('weight-panel');
  panel.innerHTML = weights.map(function(m, i) {
    return '<div class="metric-card">' +
      '<span class="metric-name">' + m.name + '</span>' +
      '<button class="dir-btn up' + (m.dir === 'up' ? ' active' : '') + '" onclick="setDir(' + i + ',\'up\')">\u2191</button>' +
      '<button class="dir-btn down' + (m.dir === 'down' ? ' active' : '') + '" onclick="setDir(' + i + ',\'down\')">\u2193</button>' +
      '<div class="metric-weight">' +
        '<span style="font-size:10px;color:var(--text-3)">-</span>' +
        '<input type="range" min="0" max="100" value="' + m.w + '" oninput="setWeight(' + i + ',+this.value)" onchange="setWeight(' + i + ',+this.value)">' +
        '<span style="font-size:10px;color:var(--text-3)">+</span>' +
        '<input class="metric-weight-num" type="number" min="0" max="100" value="' + m.w + '" onchange="setWeight(' + i + ',+this.value)">' +
      '</div>' +
    '</div>';
  }).join('');
  updateWeightSum();
}

function setDir(idx, dir) {
  weights[idx].dir = dir;
  renderWeightPanel();
  if (datasets[0]) { scores[0] = scoreDataset(datasets[0], weights, thresholds); if (datasets[1]) scores[1] = scoreDataset(datasets[1], weights, thresholds); }
  if (currentMode) rerunMode();
  saveState();
}

function setWeight(idx, val) {
  weights[idx].w = Math.max(0, Math.min(100, parseInt(val) || 0));
  renderWeightPanel();
  if (datasets[0]) { scores[0] = scoreDataset(datasets[0], weights, thresholds); if (datasets[1]) scores[1] = scoreDataset(datasets[1], weights, thresholds); }
  if (currentMode) rerunMode();
  saveState();
}

function updateWeightSum() {
  var sum = weights.reduce(function(s, m) { return s + m.w; }, 0);
  var el = document.getElementById('weight-sum');
  el.textContent = '\u5408\u8ba1\uff1a' + sum + '%';
  el.className = 'weight-sum ' + (sum === 100 ? 'ok' : 'bad');
}

function renderThresholdPanel() {
  var items = [
    { key: 'turnover', label: '\u6d41\u5931\u7387\u4e0a\u9650 (%)', val: thresholds.turnover },
    { key: 'difficulty', label: '\u96be\u5ea6\u4e0a\u9650', val: thresholds.difficulty },
    { key: 'variance', label: '\u53d8\u5f02\u7cfb\u6570\u4e0a\u9650', val: thresholds.variance },
    { key: 'consume', label: '\u4eba\u5747\u6d88\u8017\u4e0b\u9650', val: thresholds.consume },
    { key: 'revive', label: '\u590d\u6d3b\u8f6c\u5316\u4e0b\u9650 (%)', val: thresholds.revive },
    { key: 'remain', label: '\u5931\u8d25\u5269\u4f59\u7387\u4e0a\u9650', val: thresholds.remain }
  ];
  document.getElementById('threshold-panel').innerHTML = items.map(function(t) {
    return '<div class="field"><label>' + t.label + '</label>' +
      '<input type="number" step="any" value="' + t.val + '" onchange="setThreshold(\'' + t.key + '\',+this.value)">' +
    '</div>';
  }).join('');
}

function setThreshold(key, val) {
  thresholds[key] = parseFloat(val) || 0;
  if (datasets[0]) { scores[0] = scoreDataset(datasets[0], weights, thresholds); if (datasets[1]) scores[1] = scoreDataset(datasets[1], weights, thresholds); }
  if (currentMode) rerunMode();
  saveState();
}

function rerunMode() {
  if (currentMode === 'analysis') renderAnalysis();
  else if (currentMode === 'compare') renderCompare();
  else if (currentMode === 'replace') renderReplace();
}
</script>

<!-- ─── Analysis Mode ─── -->
<script>
function renderAnalysis() {
  var idx = (currentMode === 'analysis' && hasTwoFiles) ? analysisSource : 0;
  var ds = datasets[idx];
  var sc = scores[idx];
  if (!ds || !sc) return;

  var sorted = [].concat(sc).sort(function(a, b) {
    var va = a[anSortCol], vb = b[anSortCol];
    if (va === null) va = anSortDir === 'asc' ? Infinity : -Infinity;
    if (vb === null) vb = anSortDir === 'asc' ? Infinity : -Infinity;
    return anSortDir === 'asc' ? va - vb : vb - va;
  });
  var allScores = sc.map(function(r) { return r.score; });
  var avgScore = Math.round(allScores.reduce(function(s, v) { return s + v; }, 0) / allScores.length);
  var maxScore = Math.max.apply(null, allScores);
  var minScore = Math.min.apply(null, allScores);

  var mCols = [
    { key: 'tu', name: '\u6d41\u5931\u7387(%)', dir: '\u2193\u4f4e\u597d' },
    { key: 'va', name: '\u53d8\u5f02\u7cfb\u6570', dir: '\u2193\u4f4e\u597d' },
    { key: 'di', name: '\u96be\u5ea6', dir: '\u2193\u4f4e\u597d' },
    { key: 'co', name: '\u4eba\u5747\u6d88\u8017', dir: '\u2191\u9ad8\u597d' },
    { key: 're', name: '\u590d\u6d3b\u8f6c\u5316\u7387', dir: '\u2191\u9ad8\u597d' },
    { key: 'rm', name: '\u5931\u8d25\u5269\u4f59\u7387', dir: '\u2193\u4f4e\u597d' }
  ];

  var html = '';

  // Summary Cards
  html += '<div class="summary-row">' +
    '<div class="summary-card" style="border-left:4px solid var(--blue)"><h3>\u5173\u5361\u603b\u6570</h3><div class="big-num" style="color:var(--blue)">' + ds.length + '</div><div class="stats">\u4e0a\u4f20\u6570\u636e\u5168\u90e8\u5173\u5361</div></div>' +
    '<div class="summary-card" style="border-left:4px solid var(--green)"><h3>\u5e73\u5747\u8d28\u91cf\u5206</h3><div class="big-num" style="color:var(--green)">' + avgScore + '</div><div class="stats">' + ds.length + ' \u5173\u52a0\u6743\u8bc4\u5206\u5747\u503c</div></div>' +
    '<div class="summary-card" style="border-left:4px solid var(--amber)"><h3>\u6700\u9ad8\u8d28\u91cf\u5206</h3><div class="big-num" style="color:var(--amber)">' + maxScore + '</div><div class="stats">\u6700\u4f18\u5173\u5361</div></div>' +
    '<div class="summary-card" style="border-left:4px solid var(--purple)"><h3>\u6700\u4f4e\u8d28\u91cf\u5206</h3><div class="big-num" style="color:var(--purple)">' + minScore + '</div><div class="stats">\u6700\u9700\u5173\u6ce8\u5173\u5361</div></div>' +
  '</div>';

  // Insight Cards
  var introText = '\u5f53\u524d\u5206\u6790\u7684\u662f <b>' + (idx === 0 ? 'A' : 'B') + ' \u96c6</b>\uff0c\u5171 ' + ds.length + ' \u5173';
  if (hasTwoFiles) introText += '\uff0c\u53ef\u5207\u6362\u4e0a\u65b9\u201c\u5206\u6790\u5bf9\u8c61\u201d\u67e5\u770b\u53e6\u4e00\u96c6\u3002';

  var highHard = sorted.filter(function(r) { return r.score >= 70; });
  var lowHard = sorted.filter(function(r) { return r.score < 30; });
  var highTurnover = sorted.filter(function(r) { return r.tu && r.tu > thresholds.turnover; });
  var highDiff = sorted.filter(function(r) { return r.di > thresholds.difficulty; });

  html += '<div class="insight-grid">';

  html += '<div class="insight-card"><div class="ins-title" style="color:var(--amber)">\u26a0\ufe0f \u9ad8\u96be\u5ea6\u5173\u5361</div>' +
    '<div class="ins-text">' + introText + '\u3002<b>' + highHard.length + '</b> \u4e2a\u5173\u5361\u7efc\u5408\u8bc4\u5206 \u226570\uff0c\u9700\u4f18\u5148\u5173\u6ce8\u3002</div>' +
    (highHard.length ? '<div class="ins-chips">' + highHard.slice(0, 15).map(function(r) { return '<span class="ins-chip amber">Lv.' + r.lv + '</span>'; }).join('') + (highHard.length > 15 ? '<span style="font-size:11px;color:var(--text-3)">\u2026+' + (highHard.length - 15) + '</span>' : '') + '</div>' : '') +
  '</div>';

  html += '<div class="insight-card"><div class="ins-title" style="color:var(--green)">\u2705 \u4f4e\u96be\u5ea6\u5173\u5361</div>' +

// ─── Analysis sort/page state ───
var anSortCol = 'score';
var anSortDir = 'asc';
var analysisPage = 1;

function analysisSort(col) {
  if (anSortCol === col) {
    anSortDir = anSortDir === 'asc' ? 'desc' : 'asc';
  } else {
    anSortCol = col;
    anSortDir = 'asc';
  }
  analysisPage = 1;
  renderAnalysis();
}

function getSortLabel() {
  var labels = { tu: '\u6d41\u5931\u7387', va: '\u53d8\u5f02\u7cfb\u6570', di: '\u96be\u5ea6', co: '\u4eba\u5747\u6d88\u8017', re: '\u590d\u6d3b\u8f6c\u5316\u7387', rm: '\u5931\u8d25\u5269\u4f59\u7387', score: '\u7efc\u5408\u5f97\u5206' };
  return (labels[anSortCol] || anSortCol) + ' ' + (anSortDir === 'asc' ? '\u2191' : '\u2193');
}

function copyLevelList() {
  var idx = (currentMode === 'analysis' && hasTwoFiles) ? analysisSource : 0;
  var sc = scores[idx];
  if (!sc) return;
  var ids = sc.map(function(r) { return r.lv; }).sort(function(a, b) { return a - b; });
  navigator.clipboard.writeText(ids.join(', ')).then(function() {
    var btns = document.querySelectorAll('.btn-outline');
    btns.forEach(function(b) { if (b.textContent.indexOf('\u590d\u5236') >= 0) { var o = b.textContent; b.textContent = '\u2713 \u5df2\u590d\u5236'; setTimeout(function() { b.textContent = o; }, 1500); } });
  });
}

function exportAnalysisCSV() {
  var idx = (currentMode === 'analysis' && hasTwoFiles) ? analysisSource : 0;
  var sc = scores[idx];
  if (!sc) return;
  var rows = [['\u6392\u540d', 'Level', '\u5173\u5185\u6d41\u5931\u7387(%)', '\u96be\u5ea6\u53d8\u5f02\u7cfb\u6570', '\u96be\u5ea6', '\u4eba\u5747\u6d88\u8017', '\u590d\u6d3b\u8f6c\u5316\u7387', '\u5931\u8d25\u5269\u4f59\u7387', '\u7efc\u5408\u5f97\u5206', '\u6807\u6ce8']];
  sc.forEach(function(r, i) {
    rows.push([
      i + 1, r.lv,
      r.tu !== null ? r.tu : '', r.va !== null ? r.va : '', r.di,
      r.co !== null ? r.co : '', r.re !== null ? r.re : '', r.rm !== null ? r.rm : '',
      r.score,
      r.ann.map(function(a) { return a.l; }).join('; ')
    ]);
  });
  exportCSV(rows, '\u5173\u5361\u5206\u6790_' + new Date().toISOString().slice(0, 10) + '.csv');
}

<!-- ─── Compare Mode ─── -->
<script>
var compareLevels = [];  // { lv, r0, r1, delta, imp, ann0, ann1 }
var compareFilter = { status: 'all', start: 0, end: 9999, search: '' };
var compareSort = 'delta-desc';

function renderCompare() {
  if (!datasets[0] || !datasets[1] || !scores[0] || !scores[1]) return;

  var s0 = scores[0], s1 = scores[1];
  var map0 = {}, map1 = {};
  s0.forEach(function(r) { map0[r.lv] = r; });
  s1.forEach(function(r) { map1[r.lv] = r; });

  var allLvs = [];
  Object.keys(map0).forEach(function(k) { if (allLvs.indexOf(+k) < 0) allLvs.push(+k); });
  Object.keys(map1).forEach(function(k) { if (allLvs.indexOf(+k) < 0) allLvs.push(+k); });
  allLvs.sort(function(a, b) { return a - b; });

  var dirs = ['down','down','down','up','up','down'];
  var labels = ['\u6d41\u5931','\u65b9\u5dee','\u96be\u5ea6','\u6d88\u8017','\u590d\u6d3b','\u5269\u4f59\u7387'];

  compareLevels = allLvs.map(function(lv) {
    var r0 = map0[lv] || null, r1 = map1[lv] || null;
    var ds = Math.abs((r0 ? r0.score : 0) - (r1 ? r1.score : 0));
    var imp = [];
    if (r0 && r1) {
      ['tu','va','di','co','re','rm'].forEach(function(k, i) {
        var v0 = r0[k], v1 = r1[k];
        if (v0 === null || v1 === null) return;
        var better = dirs[i] === 'down' ? v1 < v0 : v1 > v0;
        if (better) imp.push(labels[i] + (dirs[i] === 'down' ? '\u2193' : '\u2191'));
      });
    }
    var ann0 = r0 ? r0.ann : [];
    var ann1 = r1 ? r1.ann : [];
    return { lv: lv, r0: r0, r1: r1, delta: ds, imp: imp, ann0: ann0, ann1: ann1 };
  });

  renderCompareTable();
}

function renderCompareTable() {
  var tot = compareLevels.length;
  var improved = compareLevels.filter(function(r) { return r.ann0.length > 0 && r.ann1.length === 0; });
  var stillBad = compareLevels.filter(function(r) { return r.ann0.length > 0 && r.ann1.length > 0; });
  var newBad = compareLevels.filter(function(r) { return r.ann1.length > 0 && (r.ann0.length === 0 || !r.r0); });
  var clean = compareLevels.filter(function(r) { return r.ann0.length === 0 && r.ann1.length === 0 && r.r0 && r.r1; });
  var v1Only = compareLevels.filter(function(r) { return r.r0 && !r.r1; });
  var v2Only = compareLevels.filter(function(r) { return !r.r0 && r.r1; });

  // Summary
  var html = '<div class="summary-row">' +
    '<div class="summary-card" style="border-left:4px solid var(--green)"><h3>\u2705 \u5df2\u4fee\u590d (' + improved.length + ')</h3><div class="stats">V1\u6709\u6807\u7b7e \u2192 V2\u65e0\u6807\u7b7e<br>\u5e73\u5747\u63d0\u5347 <b>' + (improved.length ? Math.round(improved.reduce(function(s,r){return s+r.delta},0)/improved.length) : '\u2014') + '</b> \u5206</div></div>' +
    '<div class="summary-card" style="border-left:4px solid var(--amber)"><h3>\u26a0\ufe0f \u6539\u5584\u672a\u4fee\u590d (' + stillBad.length + ')</h3><div class="stats">V1\u6709\u6807\u7b7e \u2192 V2\u4ecd\u6709\u6807\u7b7e<br>\u5e73\u5747\u63d0\u5347 <b>' + (stillBad.length ? Math.round(stillBad.reduce(function(s,r){return s+r.delta},0)/stillBad.length) : '\u2014') + '</b> \u5206</div></div>' +
    '<div class="summary-card" style="border-left:4px solid var(--red)"><h3>\u274c \u65b0\u95ee\u9898 (' + newBad.length + ')</h3><div class="stats">V1\u65e0\u6807\u7b7e \u2192 V2\u51fa\u73b0\u6807\u7b7e<br>\u9700\u6392\u67e5\u662f\u5426\u5019\u9009\u9009\u9519</div></div>' +
    '<div class="summary-card" style="border-left:4px solid var(--blue)"><h3>\uD83D\uDCCA \u6570\u636e\u6982\u89c8</h3><div class="stats">\u5168\u90e8\u6b63\u5e38\uff1a<b>' + clean.length + '</b> \u5173<br>V1\u72ec\u6709\uff1a<b>' + v1Only.length + '</b> \u00b7 V2\u72ec\u6709\uff1a<b>' + v2Only.length + '</b></div></div>' +
  '</div>';

  // Filter toolbar
  html += '<div class="toolbar">' +
    '<select id="cmp-status" onchange="cmpFilter.status=this.value;renderCompareTable()">' +
      '<option value="all">\u5168\u90e8 (' + tot + ')</option>' +
      '<option value="improved">\u5df2\u4fee\u590d (' + improved.length + ')</option>' +
      '<option value="stillbad">\u6539\u5584\u672a\u4fee\u590d (' + stillBad.length + ')</option>' +
      '<option value="newbad">\u65b0\u95ee\u9898 (' + newBad.length + ')</option>' +
      '<option value="clean">\u5168\u90e8\u6b63\u5e38 (' + clean.length + ')</option>' +
      '<option value="v1only">V1\u72ec\u6709 (' + v1Only.length + ')</option>' +
      '<option value="v2only">V2\u72ec\u6709 (' + v2Only.length + ')</option>' +
    '</select>' +
    '<select id="cmp-sort" onchange="compareSort=this.value;renderCompareTable()">' +
      '<option value="delta-desc">\u5206\u5dee \u2193 (\u53d8\u5316\u6700\u5927)</option>' +
      '<option value="delta-asc">\u5206\u5dee \u2191 (\u53d8\u5316\u6700\u5c0f)</option>' +
      '<option value="lv-asc">Level \u2191</option>' +
      '<option value="lv-desc">Level \u2193</option>' +
    '</select>' +
    '\u5f00\u59cb <input type="number" id="cmp-start" value="' + compareFilter.start + '" onchange="cmpFilter.start=+this.value;renderCompareTable()" style="width:70px">' +
    '\u7ed3\u675f <input type="number" id="cmp-end" value="' + compareFilter.end + '" onchange="cmpFilter.end=+this.value;renderCompareTable()" style="width:70px">' +
    '\u641c\u7d22 <input type="text" id="cmp-search" value="' + compareFilter.search + '" oninput="cmpFilter.search=this.value.trim();renderCompareTable()" placeholder="Level\u7f16\u53f7\uff0c\u9017\u53f7\u5206\u9694" style="width:180px">' +
    '<span class="toolbar-info" id="cmp-info"></span>' +
    '<button class="btn btn-outline" style="padding:6px 12px;font-size:11px;margin-left:8px" onclick="exportCompareCSV()">\uD83D\uDCBE \u5bfc\u51fa CSV</button>' +
  '</div>';

  // Apply filters
  var rows = compareLevels;
  var fs = compareFilter.status;
  if (fs === 'improved') rows = improved;
  else if (fs === 'stillbad') rows = stillBad;
  else if (fs === 'newbad') rows = newBad;
  else if (fs === 'clean') rows = clean;
  else if (fs === 'v1only') rows = v1Only;
  else if (fs === 'v2only') rows = v2Only;

  if (compareFilter.start) rows = rows.filter(function(r) { return r.lv >= compareFilter.start; });
  if (compareFilter.end < 9999) rows = rows.filter(function(r) { return r.lv <= compareFilter.end; });
  if (compareFilter.search) {
    var ns = compareFilter.search.split(',').map(function(s) { return parseInt(s.trim()); }).filter(function(n) { return !isNaN(n); });
    if (ns.length) rows = rows.filter(function(r) { return ns.indexOf(r.lv) >= 0; });
  }

  var dirs = ['down','down','down','up','up','down'];
  var keys = ['tu','va','di','co','re','rm'];

  // Sort
  if (compareSort === 'delta-desc') rows.sort(function(a, b) { return b.delta - a.delta; });
  else if (compareSort === 'delta-asc') rows.sort(function(a, b) { return a.delta - b.delta; });
  else if (compareSort === 'lv-asc') rows.sort(function(a, b) { return a.lv - b.lv; });
  else if (compareSort === 'lv-desc') rows.sort(function(a, b) { return b.lv - a.lv; });

  // Table
  html += '<div class="table-wrap"><table style="table-layout:auto;font-size:11px">' +
    '<thead><tr>' +
    '<th>Level</th>' +
    '<th>V1\u5206</th><th>V2\u5206</th><th>\u0394</th>' +
    '<th>\u6d41\u5931\u7387 \u2193\u4f4e\u597d</th>' +
    '<th>\u96be\u5ea6 \u2193\u4f4e\u597d</th>' +
    '<th>\u53d8\u5f02 \u2193\u4f4e\u597d</th>' +
    '<th>\u6d88\u8017 \u2191\u9ad8\u597d</th>' +
    '<th>\u590d\u6d3b \u2191\u9ad8\u597d</th>' +
    '<th>\u5269\u4f59\u7387 \u2193\u4f4e\u597d</th>' +
    '<th style="width:70px">\u6539\u5584</th>' +
    '<th>\u6807\u7b7e\u5206\u7c7b</th>' +
    '</tr></thead><tbody>';

  rows.forEach(function(r) {
    var sc0 = r.r0 ? r.r0.score : '\u2014';
    var sc1 = r.r1 ? r.r1.score : '\u2014';
    var arrow = r.r0 && r.r1 ? (r.r1.score > r.r0.score ? '<span style="color:var(--green)">\u2191</span>' : r.r1.score < r.r0.score ? '<span style="color:var(--red)">\u2193</span>' : '\u2014') : '\u2014';

    var tag = '\u2014';
    if (r.ann0.length && !r.ann1.length) tag = '<span class="chip ch-green">\u5df2\u4fee\u590d</span>';
    else if (r.ann0.length && r.ann1.length) tag = '<span class="chip ch-amber">\u6539\u5584\u672a\u4fee\u590d</span>';
    else if (r.ann1.length && !r.ann0.length) tag = '<span class="chip ch-red">\u65b0\u95ee\u9898</span>';
    else if (r.r0 && r.r1) tag = '<span class="chip ch-blue">\u6b63\u5e38</span>';
    else if (r.r0 && !r.r1) tag = '<span class="chip ch-purple">V1\u72ec\u6709</span>';
    else if (!r.r0 && r.r1) tag = '<span class="chip ch-purple">V2\u72ec\u6709</span>';

    html += '<tr>' +
      '<td><span class="lv-tag">Lv.' + r.lv + '</span></td>' +
      '<td class="r">' + sc0 + '</td><td class="r">' + sc1 + '</td><td class="r">' + (r.r0 && r.r1 ? arrow + r.delta : '\u2014') + '</td>';

    keys.forEach(function(k, i) {
      var v0 = r.r0 ? r.r0[k] : null;
      var v1 = r.r1 ? r.r1[k] : null;
      if (v0 === null || v1 === null || !r.r0 || !r.r1) {
        html += '<td class="r">' + (v0 !== null ? fmtVal(k, v0) : '\u2014') + '</td>';
        return;
      }
      var better = dirs[i] === 'down' ? v1 < v0 : v1 > v0;
      var cls = better ? 'c-green' : 'c-red';
      var upDown = v1 > v0 ? '\u2191' : v1 < v0 ? '\u2193' : '\u2014';
      var arrColor = better ? 'var(--green)' : 'var(--red)';
      html += '<td class="r">' +
        fmtVal(k, v0) + ' \u2192 <b class="' + cls + '">' + fmtVal(k, v1) + '</b> ' +
        '<span style="color:' + arrColor + '">' + upDown + '</span>' +
      '</td>';
    });

    html += '<td>' + (r.imp.length ? r.imp.map(function(x) { return '<span class="chip ch-green">' + x + '</span>'; }).join(' ') : '\u2014') + '</td>';
    html += '<td>' + tag + '</td>';
    html += '</tr>';
  });

  html += '</tbody></table></div>';

  html += '<div class="footbar"><b>\u5bf9\u6bd4\u8bf4\u660e\uff1a</b>\u6bcf\u9879\u6307\u6807\u663e\u793a V1\u503c\u2192V2\u503c \u2191\u2193\uff0c\u7eff\u8272=\u6539\u5584\uff0c\u7ea2\u8272=\u6076\u5316\u3002\u201c\u5df2\u4fee\u590d\u201d=V1\u6709\u6807\u7b7e\u4f46V2\u65e0\uff1b\u201c\u6539\u5584\u672a\u4fee\u590d\u201d=\u4e24\u7248\u5747\u6709\u6807\u7b7e\uff1b\u201c\u65b0\u95ee\u9898\u201d=V1\u65e0\u6807\u7b7e\u4f46V2\u6709\u3002</div>';

  document.getElementById('result-wrap').innerHTML = html;
  document.getElementById('cmp-info').textContent = '\u663e\u793a ' + rows.length + ' / ' + tot + ' \u5173';
  document.getElementById('result-wrap').classList.add('show');
}

function fmtVal(k, v) {
  if (v === null || v === undefined) return 'N/A';
  if (k === 're') return (v * 100).toFixed(1);
  if (k === 'tu') return v.toFixed(2);
  if (k === 'va') return v.toFixed(3);
  if (k === 'co') return Math.round(v);
  if (k === 'rm') return v.toFixed(3);
  return v;
}

function exportCompareCSV() {
  var rows = [['Level', 'V1_Score', 'V2_Score', 'Delta', '\u6d41\u5931\u7387(V1)', '\u6d41\u5931\u7387(V2)', '\u96be\u5ea6(V1)', '\u96be\u5ea6(V2)', '\u53d8\u5f02(V1)', '\u53d8\u5f02(V2)', '\u6d88\u8017(V1)', '\u6d88\u8017(V2)', '\u590d\u6d3b(V1)', '\u590d\u6d3b(V2)', '\u5269\u4f59\u7387(V1)', '\u5269\u4f59\u7387(V2)', '\u6807\u7b7e']];
  compareLevels.forEach(function(r) {
    var tag = '\u2014';
    if (r.ann0.length && !r.ann1.length) tag = '\u5df2\u4fee\u590d';
    else if (r.ann0.length && r.ann1.length) tag = '\u6539\u5584\u672a\u4fee\u590d';
    else if (r.ann1.length && !r.ann0.length) tag = '\u65b0\u95ee\u9898';
    else if (r.r0 && r.r1) tag = '\u6b63\u5e38';
    rows.push([
      r.lv, r.r0 ? r.r0.score : '', r.r1 ? r.r1.score : '', r.delta,
      r.r0 ? r.r0.tu : '', r.r1 ? r.r1.tu : '',
      r.r0 ? r.r0.di : '', r.r1 ? r.r1.di : '',
      r.r0 ? r.r0.va : '', r.r1 ? r.r1.va : '',
      r.r0 ? r.r0.co : '', r.r1 ? r.r1.co : '',
      r.r0 ? r.r0.re : '', r.r1 ? r.r1.re : '',
      r.r0 ? r.r0.rm : '', r.r1 ? r.r1.rm : '',
      tag
    ]);
  });
  exportCSV(rows, '\u5173\u5361\u5bf9\u6bd4_' + new Date().toISOString().slice(0, 10) + '.csv');
}
</script>

<!-- ─── Replace Mode ─── -->
<script>
var replaceLevels = [];  // { lv, tu, va, di, co, re, rm, ann, adv, score, ql, cands }
var replaceFilter = { status: 'all', start: 0, end: 9999, search: '' };

function renderReplace() {
  if (!datasets[0] || !scores[0]) return;
  var sc = scores[0];

  // Build B-side map for candidate matching
  var bMap = [];
  if (datasets[1] && scores[1]) {
    var lcB = findLevelCol(datasets[1]);
    var dC = findCol(datasets[1], ['\u96be\u5ea6']);
    var tC = findCol(datasets[1], ['\u5173\u5185\u6d41\u5931\u7387(%)', '\u5173\u5185\u6d41\u5931\u7387']);
    var vC = findCol(datasets[1], ['\u96be\u5ea6\u53d8\u5f02\u7cfb\u6570(\u5173\u5185)', '\u96be\u5ea6\u53d8\u5f02\u7cfb\u6570']);
    bMap = datasets[1].map(function(d) {
      return { l: parseInt(d[lcB]) || 0, d: d[dC] || 1, tu: sv(d, tC), va: sv(d, vC) };
    });
  }

  // Build replace levels from A set
  replaceLevels = sc.map(function(r) {
    var cands = [];
    if (bMap.length) {
      cands = bMap.map(function(b) {
        return { l: b.l, d: b.d, tu: b.tu, va: b.va, g: Math.abs(b.d - (r.di || 0)) };
      }).sort(function(a, b) { return a.g - b.g; }).slice(0, 5);
    }
    return r;  // already has all score fields; add cands
  });
  replaceLevels.forEach(function(r) {
    r.cands = (bMap.length) ? bMap.map(function(b) {
      return { l: b.l, d: b.d, tu: b.tu, va: b.va, g: Math.abs(b.d - (r.di || 0)) };
    }).sort(function(a, b) { return a.g - b.g; }).slice(0, 5) : [];
  });
  replaceLevels.sort(function(a, b) { return a.lv - b.lv; });
  replaceLevels.forEach(function(r) {
    if (!repl[r.lv]) repl[r.lv] = { status: 'pending', bLv: null };
  });

  renderReplaceTable();
}

function renderReplaceTable() {
  var mt = thresholds.turnover, md = thresholds.difficulty, mv = thresholds.variance;
  var tot = replaceLevels.length;
  var bySc = [].concat(replaceLevels).sort(function(a, b) { return a.score - b.score; });
  var done = replaceLevels.filter(function(r) { return (repl[r.lv] || {}).status === 'done'; });
  var skip = replaceLevels.filter(function(r) { return (repl[r.lv] || {}).status === 'skip'; });

  // Duplicate detection
  var used = {};
  var dupes = [];
  done.forEach(function(r) { var b = (repl[r.lv] || {}).bLv; if (b) { used[b] = (used[b] || 0) + 1; } });
  Object.keys(used).forEach(function(b) { if (used[b] > 1) dupes.push(b); });

  // Summary
  var html = '<div class="summary-row">' +
    '<div class="summary-card" style="border-left:4px solid var(--blue)"><h3>\uD83D\uDCCB A \u96c6\u8bca\u65ad</h3><div class="stats">\u603b\u5173\u6570\uff1a<b>' + tot + '</b> \u00b7 \u5df2\u66ff\u6362\uff1a<b>' + done.length + '</b> \u00b7 \u8df3\u8fc7\uff1a<b>' + skip.length + '</b><br>\u96be\u5ea6 <b>' + Math.min.apply(null, replaceLevels.map(function(r){return r.di})).toFixed(2) + '-' + Math.max.apply(null, replaceLevels.map(function(r){return r.di})).toFixed(2) + '</b></div></div>' +
    '<div class="summary-card" style="border-left:4px solid var(--green)"><h3>\uD83D\uDCC1 B \u96c6</h3><div class="stats">' + (datasets[1] ? '\u603b\u5173\u6570\uff1a<b>' + datasets[1].length + '</b><br>\u96be\u5ea6 <b>' + Math.min.apply(null, datasets[1].map(function(d){return d['\u96be\u5ea6']||1})).toFixed(2) + '-' + Math.max.apply(null, datasets[1].map(function(d){return d['\u96be\u5ea6']||1})).toFixed(2) + '</b>' : '\u672a\u4e0a\u4f20\uff0c\u4e0a\u4f20\u540e\u53ef\u5339\u914d\u5019\u9009') + '</div></div>' +
    '<div class="summary-card" style="border-left:4px solid var(--amber)"><h3>\uD83D\uDCCA \u8d28\u91cf\u6982\u89c8</h3><div class="stats">\u6700\u4f4e\u5206 <b>' + bySc[0].score + '</b> \u00b7 \u6700\u9ad8\u5206 <b>' + bySc[bySc.length - 1].score + '</b><br>\u5e95\u7ebf20\u5747\u5206 <b>' + Math.round(bySc.slice(0,20).reduce(function(s,r){return s+r.score},0)/20) + '</b></div></div>' +
    (dupes.length ? '<div class="summary-card" style="border-left:4px solid var(--red)"><h3>\u26a0\ufe0f B\u91cd\u590d\u66ff\u6362</h3><div class="stats">' + dupes.length + ' \u4e2a B \u5173\u5361\u88ab\u591a\u6b21\u4f7f\u7528<br><span style="color:var(--red)">#' + dupes.join(',#') + '</span></div></div>' : '') +
  '</div>';

  // Filter toolbar
  html += '<div class="toolbar">' +
    '<select id="repl-status" onchange="replaceFilter.status=this.value;renderReplaceTable()">' +
      '<option value="all">\u5168\u90e8 (' + tot + ')</option>' +
      '<option value="pending">\u5f85\u5904\u7406 (' + (tot - done.length - skip.length) + ')</option>' +
      '<option value="done">\u5df2\u66ff\u6362 (' + done.length + ')</option>' +
      '<option value="skip">\u5df2\u8df3\u8fc7 (' + skip.length + ')</option>' +
      '<option value="low">\u6700\u4f4e50\u5206 (' + Math.min(50, tot) + ')</option>' +
    '</select>' +
    '\u5f00\u59cb <input type="number" id="repl-start" value="' + replaceFilter.start + '" onchange="replaceFilter.start=+this.value;renderReplaceTable()" style="width:70px">' +
    '\u7ed3\u675f <input type="number" id="repl-end" value="' + replaceFilter.end + '" onchange="replaceFilter.end=+this.value;renderReplaceTable()" style="width:70px">' +
    '\u641c\u7d22 <input type="text" id="repl-search" value="' + replaceFilter.search + '" oninput="replaceFilter.search=this.value.trim();renderReplaceTable()" placeholder="Level\u7f16\u53f7" style="width:150px">' +
    '<span class="toolbar-info" id="repl-info"></span>' +
    '<button class="btn btn-outline" style="padding:6px 12px;font-size:11px;margin-left:8px" onclick="exportReplaceCSV()">\uD83D\uDCBE \u5bfc\u51fa\u5bf9\u7167\u8868</button>' +
  '</div>';

  // Filter
  var rows = replaceLevels;
  var fs = replaceFilter.status;
  if (fs === 'done') rows = done;
  else if (fs === 'skip') rows = skip;
  else if (fs === 'pending') rows = replaceLevels.filter(function(r) { return (repl[r.lv] || {}).status === 'pending'; });
  else if (fs === 'low') rows = bySc.slice(0, 50);
  if (replaceFilter.start) rows = rows.filter(function(r) { return r.lv >= replaceFilter.start; });
  if (replaceFilter.end < 9999) rows = rows.filter(function(r) { return r.lv <= replaceFilter.end; });
  if (replaceFilter.search) {
    var ns = replaceFilter.search.split(',').map(function(s) { return parseInt(s.trim()); }).filter(function(n) { return !isNaN(n); });
    if (ns.length) rows = rows.filter(function(r) { return ns.indexOf(r.lv) >= 0; });
  }

  // Table
  var infoText = '\u663e\u793a ' + rows.length + ' / ' + tot + ' \u5173';
  html += '<div class="table-wrap"><table style="table-layout:auto;font-size:11px">' +
    '<thead><tr>' +
    '<th>Level</th><th>\u8d28\u91cf\u5206</th><th>\u6d41\u5931%</th><th>\u96be\u5ea6</th><th>\u53d8\u5f02</th><th>\u6807\u6ce8</th><th>B\u5019\u9009</th><th>\u64cd\u4f5c</th>' +
    '</tr></thead><tbody>';

  rows.forEach(function(r) {
    var rp = repl[r.lv] || { status: 'pending', bLv: null };
    var scCls = r.score < 40 ? 'c-red' : r.score < 60 ? 'c-amber' : 'c-green';
    var ann = r.ann.map(function(a) { return '<span class="chip ch-red">' + a.l + '</span>'; }).join(' ') || '\u2014';

    var cs = r.cands.map(function(c, i) {
      var sel = (repl[r.lv] || {}).bLv === c.l;
      var bt = c.tu !== null ? ' \u6d41\u5931' + (c.tu || 0).toFixed(1) + '%' : '';
      return '<span class="candidate' + (i === 0 ? ' best' : '') + (sel ? ' sel' : '') + '" onclick="event.stopPropagation();replSel(' + r.lv + ',' + c.l + ')">#' + c.l + '<small>\u96be\u5ea6' + c.d.toFixed(2) + bt + '</small></span>';
    }).join(' ') || '\u2014';

    var actionHtml = '';
    if (rp.status === 'done') actionHtml = '<span class="chip ch-green">\u5df2\u66ff\u6362 \u2192 Lv.' + rp.bLv + '</span>';
    else if (rp.status === 'skip') actionHtml = '<span class="chip ch-amber">\u5df2\u8df3\u8fc7</span>';
    else actionHtml = '<button class="action-btn rp" onclick="event.stopPropagation();replDo(' + r.lv + ')">\u66ff\u6362</button><button class="action-btn sk" onclick="event.stopPropagation();replSkip(' + r.lv + ')">\u8df3\u8fc7</button>';

    html += '<tr>' +
      '<td><span class="lv-tag">Lv.' + r.lv + '</span></td>' +
      '<td class="r"><b class="' + scCls + '">' + r.score + '</b></td>' +
      '<td class="r' + (r.tu > mt ? ' c-red' : '') + '">' + (r.tu || 0).toFixed(2) + '</td>' +
      '<td class="r' + (r.di > md ? ' c-amber' : '') + '">' + r.di.toFixed(2) + '</td>' +
      '<td class="r' + ((r.va || 0) > mv ? ' c-amber' : '') + '">' + (r.va || 0).toFixed(3) + '</td>' +
      '<td>' + ann + '</td>' +
      '<td>' + cs + '</td>' +
      '<td>' + actionHtml + '</td>' +
    '</tr>';
  });

  html += '</tbody></table></div>';

  var wDesc = weights.map(function(m) { return m.name + '(' + (m.dir === 'down' ? '\u2193' : '\u2191') + ')' + m.w + '%'; }).join(' \u00b7 ');
  html += '<div class="footbar"><b>\u8bc4\u5206\u6743\u91cd\uff1a</b>' + wDesc + '\u3002\u6807\u6ce8\u4ec5\u7528\u4e8e\u9ad8\u4eae\uff0c\u4e0d\u786c\u8fc7\u6ee4\u3002B\u5019\u9009\u6309\u96be\u5ea6\u5dee\u6392\u5e8f\uff0c<b>\u70b9\u51fb\u5019\u9009</b>\u9009\u4e2d\u540e\u518d\u70b9\u66ff\u6362\u786e\u8ba4\u3002</div>';

  document.getElementById('result-wrap').innerHTML = html;
  document.getElementById('repl-info').textContent = infoText;
  document.getElementById('result-wrap').classList.add('show');
}

function replSel(lv, bl) { repl[lv] = { status: 'pending', bLv: bl }; renderReplaceTable(); saveState(); }
function replDo(lv) {
  var r = repl[lv] || {};
  if (!r.bLv) {
    var row = replaceLevels.find(function(x) { return x.lv === lv; });
    if (row && row.cands.length) r.bLv = row.cands[0].l;
  }
  r.status = 'done';
  repl[lv] = r;
  renderReplaceTable();
  saveState();
}
function replSkip(lv) { repl[lv] = { status: 'skip', bLv: null }; renderReplaceTable(); saveState(); }
function replUndo(lv) { repl[lv] = { status: 'pending', bLv: null }; renderReplaceTable(); saveState(); }

function exportReplaceCSV() {
  var rows = [['A_Level', '\u8d28\u91cf\u5206', '\u6d41\u5931%', '\u96be\u5ea6', '\u53d8\u5f02', '\u66ff\u6362\u72b6\u6001', 'B_Level', '\u5907\u6ce8']];
  var probs = replaceLevels.filter(function(r) { return r.ann.length || (repl[r.lv] || {}).status !== 'pending'; });
  (probs.length ? probs : replaceLevels).forEach(function(r) {
    var rp = repl[r.lv] || {};
    rows.push([
      r.lv, r.score, (r.tu || 0).toFixed(2), r.di.toFixed(2), (r.va || 0).toFixed(3),
      rp.status || 'pending', rp.bLv || '',
      rp.status === 'done' ? '\u5df2\u66ff\u6362' : rp.status === 'skip' ? '\u8df3\u8fc7' : '\u5f85\u5904\u7406'
    ]);
  });
  exportCSV(rows, '\u66ff\u6362\u5bf9\u7167\u8868_' + new Date().toISOString().slice(0, 10) + '.csv');
}
</script>
