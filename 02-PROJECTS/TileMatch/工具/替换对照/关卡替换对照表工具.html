<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关卡替换对照表工具</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0f2f5;--surface:#fff;--border:#e2e6ed;--text:#1a1d23;--text-2:#6b7280;--text-3:#9ca3af;--blue:#4f6ef7;--blue-light:#eef2ff;--green:#10b981;--green-light:#d1fae5;--amber:#f59e0b;--red:#ef4444;--purple:#a855f7}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.topbar{background:#1a1d23;height:52px;display:flex;align-items:center;padding:0 32px;gap:16px;position:sticky;top:0;z-index:100}
.topbar-brand{font-size:14px;font-weight:600;color:#fff}
.topbar-brand em{color:#6c8ef5;font-style:normal}
.topbar-divider{width:1px;height:18px;background:#333}
.topbar-hint{font-size:12px;color:#6b7280}

.upload-wrap{padding:32px;max-width:800px;margin:0 auto}
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.upload-zone{border:2px dashed #c7d2fe;border-radius:16px;background:#fff;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:border-color .2s,background .2s}
.upload-zone:hover{border-color:var(--blue);background:var(--blue-light)}
.upload-zone.loaded{border-color:var(--green);background:var(--green-light)}
.uz-icon{font-size:28px}
.uz-name{font-size:13px;font-weight:600}
.uz-status{font-size:11px;color:var(--text-3)}
.uz-file{font-size:11px;color:var(--text-2)}

.settings-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 24px;margin-bottom:16px}
.settings-title{font-size:13px;font-weight:600;margin-bottom:14px}
.settings-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px}
.field input{border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--text);background:var(--bg);outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--blue);background:#fff}

.metric-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.metric-card{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:10px 14px;border:1px solid var(--border)}
.metric-name{font-size:13px;font-weight:600;flex:1}
.dir-btn{border:1px solid var(--border);background:#fff;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;min-width:32px;text-align:center;transition:.15s}
.dir-btn.up{color:var(--green)}.dir-btn.up.active{background:var(--green);color:#fff;border-color:var(--green)}
.dir-btn.down{color:var(--red)}.dir-btn.down.active{background:var(--red);color:#fff;border-color:var(--red)}
.metric-weight{display:flex;align-items:center;gap:6px}
.metric-weight input[type=range]{width:130px;accent-color:var(--blue)}
.metric-weight-num{font-size:12px;font-weight:600;color:var(--blue);width:48px;text-align:center;border:1px solid var(--border);border-radius:6px;padding:2px 4px;background:var(--bg);outline:none}
.metric-weight-num:focus{border-color:var(--blue);background:#fff}
.weight-sum{font-size:11px;color:var(--text-3);text-align:right}
.weight-sum.ok{color:var(--green)}.weight-sum.bad{color:var(--red)}

.run-btn{width:100%;margin-top:8px;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s}
.run-btn:hover{opacity:.88}
.run-btn:disabled{opacity:.4;cursor:not-allowed}

.result-wrap{padding:32px;max-width:1200px;margin:0 auto;display:none}
.result-wrap.show{display:block}

.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.summary-card h3{font-size:13px;font-weight:600;margin-bottom:6px}
.stats{font-size:12px;color:var(--text-2);line-height:1.8}

.status-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.stat-item{font-size:12px;color:var(--text-2)}
.stat-item b{font-size:16px;color:var(--text);font-weight:700}

.sec-title{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-title span{font-size:11px;font-weight:400;color:var(--text-3)}

.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.filter-bar select,.filter-bar input{border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--text);background:var(--bg);outline:none}
.filter-bar label{font-size:11px;color:var(--text-3);font-weight:600}

.card{background:var(--surface);border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:16px}
.table-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.table-head h3{font-size:13px;font-weight:600}
.export-btn{background:var(--bg);border:1px solid var(--border);color:var(--text-2);border-radius:6px;padding:6px 12px;font-size:11px;font-weight:500;cursor:pointer}
.export-btn:hover{background:#e4e7ef}

table{width:100%;border-collapse:collapse}
thead th{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;text-align:left;background:#f8f9fb;border-bottom:1px solid var(--border);white-space:nowrap}
th.r,td.r{text-align:right}
tbody tr{border-bottom:1px solid #f2f4f7;cursor:pointer;transition:background .1s}
tbody tr:hover{background:#f8f9ff}
tbody tr:last-child{border-bottom:none}
td{padding:8px 10px;font-size:12px;vertical-align:middle}

.lv-tag{font-weight:700;font-size:12px;padding:2px 7px;border-radius:5px;display:inline-block;background:var(--blue-light);color:var(--blue)}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px}
.bd-red{background:#fee2e2;color:#991b1b}.bd-amber{background:#fef3c7;color:#92400e}.bd-green{background:var(--green-light);color:#065f46}
.c-green{color:#059669;font-weight:600}.c-red{color:var(--red);font-weight:600}.c-amber{color:var(--amber);font-weight:600}

.chip{font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;display:inline-block;margin:1px}
.ch-red{background:#fee2e2;color:#991b1b}
.ch-amber{background:#fff7ed;color:#9a3412}
.ch-green{background:#d1fae5;color:#065f46}
.ch-purple{background:#f3e8ff;color:#6b21a8}

.candidate{display:inline-block;margin:1px;padding:1px 5px;border-radius:3px;cursor:pointer;font-size:11px;border:1px solid var(--border);background:#fff}
.candidate:hover{background:var(--blue-light)}
.candidate.best{background:var(--blue-light);color:var(--blue);font-weight:600}
.candidate.sel{border:1px solid var(--blue);background:var(--blue-light);box-shadow:0 0 0 1px var(--blue)}

.action-btn{border:1px solid var(--border);background:#fff;border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer;margin:1px 2px;display:inline-block;min-width:26px;text-align:center}
.action-btn.rp{color:var(--green);border-color:var(--green)}.action-btn.rp:hover{background:var(--green-light)}
.action-btn.sk{color:var(--amber);border-color:var(--amber)}.action-btn.sk:hover{background:#fef3c7}

.detail-panel{display:none;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin-bottom:16px}
.detail-panel.show{display:block}
.detail-head{display:flex;justify-content:space-between;margin-bottom:12px}
.detail-head h3{font-size:14px;font-weight:600}
.detail-close{background:none;border:none;font-size:18px;color:var(--text-3);cursor:pointer}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.m-row{display:flex;gap:8px;padding:3px 0;font-size:12px;align-items:center}
.m-label{color:var(--text-3);width:100px;flex-shrink:0}
.m-val{font-weight:600;width:70px;text-align:right}

.footnote{font-size:11px;color:var(--text-3);margin-top:16px;line-height:1.8}
.loading{display:none;text-align:center;padding:20px;font-size:13px;color:var(--text-2)}.loading.show{display:block}

@media(max-width:768px){.upload-grid,.summary-grid,.settings-grid,.detail-grid{grid-template-columns:1fr}.result-wrap{padding:16px}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">替换<em>对照</em>工具</div>
  <div class="topbar-divider"></div>
  <div class="topbar-hint">上传 A / B 关卡数据，诊断 A 问题关并匹配 B 替换候选</div>
</div>

<div class="upload-wrap" id="upload-section">
  <div class="upload-grid">
    <div class="upload-zone" id="drop-a" onclick="document.getElementById('fin-a').click()">
      <div class="uz-icon" id="icon-a">📋</div>
      <div class="uz-name">A 集数据</div>
      <div class="uz-status" id="stat-a">拖拽或点击上传 Excel</div>
      <div class="uz-file" id="file-a"></div>
      <input type="file" id="fin-a" style="display:none" accept=".xlsx,.xls,.csv">
    </div>
    <div class="upload-zone" id="drop-b" onclick="document.getElementById('fin-b').click()">
      <div class="uz-icon" id="icon-b">📁</div>
      <div class="uz-name">B 集数据（可选）</div>
      <div class="uz-status" id="stat-b">拖拽或点击上传 Excel</div>
      <div class="uz-file" id="file-b"></div>
      <input type="file" id="fin-b" style="display:none" accept=".xlsx,.xls,.csv">
    </div>
  </div>

  <div class="settings-wrap">
    <div class="settings-title">🔴 基础标准</div>
    <div class="settings-grid">
      <div class="field"><label>流失率上限 (%)</label><input type="number" id="max-turnover" value="1.5" step="0.1"></div>
      <div class="field"><label>难度上限</label><input type="number" id="max-difficulty" value="3.0" step="0.1"></div>
      <div class="field"><label>变异系数上限</label><input type="number" id="max-variance" value="1.2" step="0.1"></div>
    </div>
  </div>

  <div class="settings-wrap">
    <div class="settings-title">🟡 进阶标准</div>
    <div class="settings-grid">
      <div class="field"><label>人均消耗下限</label><input type="number" id="min-consume" value="200" step="10"></div>
      <div class="field"><label>复活转化率下限 (%)</label><input type="number" id="min-revive" value="15" step="1"></div>
      <div class="field"><label>失败剩余率上限</label><input type="number" id="min-remain" value="0.44" step="0.01"></div>
    </div>
  </div>

  <div class="settings-wrap">
    <div class="settings-title">评分指标与权重</div>
    <div class="metric-list" id="weight-list"></div>
    <div class="weight-sum ok" id="wsum">✓ 权重合计：100%</div>
  </div>

  <button class="run-btn" id="run-btn" onclick="run()" disabled>🔍 加载数据并分析</button>
  <div class="loading" id="loading">⏳ 分析中…</div>
</div>

<div class="result-wrap" id="result">
  <div class="summary-grid" id="summary"></div>
  <div class="status-bar" id="sbar"></div>

  <div class="detail-panel" id="detail">
    <div class="detail-head"><h3 id="dt-title"></h3><button class="detail-close" onclick="clsDetail()">×</button></div>
    <div class="detail-grid" id="dt-grid"></div>
  </div>

  <div class="sec-title">A 集诊断排序 <span id="tinfo"></span></div>
  <div class="filter-bar">
    <label>筛选：</label>
    <select id="f-status" onchange="render()">
      <option value="all">全部</option>
      <option value="low">低分 Top 50</option>
      <option value="done">已替换</option>
      <option value="skip">跳过</option>
    </select>
    <label>区间：</label>
    <input type="number" id="f-start" placeholder="起始" style="width:70px" onchange="render()">
    <span style="color:var(--text-3);font-size:12px">—</span>
    <input type="number" id="f-end" placeholder="结束" style="width:70px" onchange="render()">
    <label>搜索：</label>
    <input type="text" id="f-search" placeholder="如 75,186" style="width:90px" oninput="render()">
  </div>

  <div class="card">
    <div class="table-head">
      <h3>关卡列表</h3>
      <button class="export-btn" onclick="expCSV()">⬇ 导出对照表 CSV</button>
    </div>
    <div style="overflow-x:auto"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </div>
  <div class="footnote" id="foot"></div>
</div>

<script>
// ─── state ───
let da=[], db=[], levels=[];
let repl={}; // {lv:{status:'pending'|'done'|'skip', bLv:null}}
let weights=[
  {name:'流失率', key:'turnover', dir:'down', w:40},
  {name:'体验方差', key:'variance', dir:'down', w:25},
  {name:'难度', key:'difficulty', dir:'down', w:15},
  {name:'人均消耗', key:'consume', dir:'up', w:10},
  {name:'复活转化', key:'revive', dir:'up', w:5},
  {name:'失败剩余率', key:'remain', dir:'down', w:5}
];

// ─── weight UI ───
(function initWeights(){
  const c=document.getElementById('weight-list');
  function ren(){c.innerHTML=weights.map((m,i)=>`
    <div class="metric-card">
      <span class="metric-name">${m.name}</span>
      <button class="dir-btn up${m.dir=='up'?' active':''}" onclick="weights[${i}].dir='up';renW()">↑</button>
      <button class="dir-btn down${m.dir=='down'?' active':''}" onclick="weights[${i}].dir='down';renW()">↓</button>
      <div class="metric-weight">
        <input type="range" min="0" max="100" value="${m.w}" oninput="wsSlide(${i},this.value)">
        <input type="number" min="0" max="100" value="${m.w}" class="metric-weight-num" id="wn${i}" oninput="wsSlide(${i},this.value)">
      </div>
    </div>`).join('');wsSync();}
  window.wsSlide=function(i,v){var n=Math.min(100,Math.max(0,parseInt(v)||0));weights[i].w=n;var s=document.getElementById('wn'+i);if(s)s.value=n;wsSync()}
  window.wsSync=function(){var s=weights.reduce((a,b)=>a+b.w,0),el=document.getElementById('wsum');el.textContent=(s==100?'✓':'⚠')+' 权重合计：'+s+'%';el.className='weight-sum '+(s==100?'ok':'bad')}
  window.renW=ren;
  ren();
})();

// ─── upload ───
(function(){
  ['a','b'].forEach(x=>{
    var z=document.getElementById('drop-'+x),f=document.getElementById('fin-'+x);
    z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('drag')});
    z.addEventListener('dragleave',()=>z.classList.remove('drag'));
    z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('drag');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0],x)});
    f.addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0],x)});
  });
})();

function loadFile(file,tag){
  var r=new FileReader();
  r.onload=function(e){
    var d=new Uint8Array(e.target.result),wb=XLSX.read(d,{type:'array'});
    var ws=wb.Sheets[wb.SheetNames[0]],jd=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    var hdr=jd[0].map(h=>String(h).trim()),parsed=[];
    for(var i=1;i<jd.length;i++){
      var row=jd[i],obj={};
      var lvRaw=row[0],lvStr=String(lvRaw||'').trim();
      if(lvStr==='')continue; // skip rows without Level
      for(var j=0;j<hdr.length;j++){var v=row[j];if(v===undefined||v===null)v='';obj[hdr[j]]=v;
        var ns=String(v).trim();if(ns.endsWith('%'))ns=ns.slice(0,-1).trim();
        if(ns!==''&&!isNaN(ns)&&ns!=='true'&&ns!=='false'){obj[hdr[j]]=parseFloat(ns);obj['_r_'+hdr[j]]=ns}}
      parsed.push(obj);
    }
    if(tag=='a'){da=parsed;document.getElementById('drop-a').classList.add('loaded')}
    else{db=parsed;document.getElementById('drop-b').classList.add('loaded')}
    document.getElementById('stat-'+tag).textContent='✓ '+parsed.length+' 行';
    document.getElementById('file-'+tag).textContent=file.name;
    document.getElementById('icon-'+tag).textContent='✅';
    if(da.length){var b=document.getElementById('run-btn');b.disabled=false;b.textContent='🔍 加载并分析'}
  };r.readAsArrayBuffer(file);
}

// ─── analysis ───
function run(){
  document.getElementById('loading').classList.add('show');
  setTimeout(function(){
    var mt=+document.getElementById('max-turnover').value,md=+document.getElementById('max-difficulty').value;
    var mv=+document.getElementById('max-variance').value,mc=+document.getElementById('min-consume').value;
    var mr=+document.getElementById('min-revive').value/100,mm=+document.getElementById('min-remain').value;

    var lcA=findLevelCol(da),lcB=db.length?findLevelCol(db):null;
    var tC=findCol(da,['关内流失率(%)','关内流失率']);
    var vC=findCol(da,['难度变异系数(关内)','难度变异系数']);
    var dC=findCol(da,['难度']);var cC=findCol(da,['人均消耗']);
    var rC=findCol(da,['复活转化率']);var mC=findCol(da,['首次失败剩余率']);

    function sv(d,k){var v=d[k];return v!==undefined&&v!==null&&v!==''&&!isNaN(v)?v:null}
    var cols=[tC,vC,dC,cC,rC,mC];
    var norms=cols.map(function(c){
      var vs=da.map(function(d){return sv(d,c)}).filter(function(v){return v!==null});
      return vs.length?{mn:Math.min.apply(null,vs),mx:Math.max.apply(null,vs)}:{mn:0,mx:1};
    });

    levels=da.map(function(d){
      var lv=parseInt(d[lcA])||0,tu=sv(d,tC),va=sv(d,vC),di=sv(d,dC)||1;
      var co=sv(d,cC),re=sv(d,rC),rm=sv(d,mC),ql=d['关卡数据质量标签']||'';

      var ann=[];if(tu>mt)ann.push({t:'turnover',l:'流失'+tu.toFixed(2)+'%'});
      if(di>md)ann.push({t:'difficulty',l:'偏难'+di.toFixed(2)});
      if(va>mv)ann.push({t:'variance',l:'方差'+va.toFixed(2)});

      var adv=[];if(co!==null&&co<mc)adv.push('消耗低');
      if(re!==null&&re<mr)adv.push('复活转化低');if(rm!==null&&rm>mm)adv.push('剩余率高');

      var raw=[tu,va,di,co,re,rm],sc=0,tw=0;
      weights.forEach(function(m,i){var v=raw[i];if(v===null)return;var n=norms[i];if(n.mx==n.mn)return;
        var nm=(v-n.mn)/(n.mx-n.mn);if(m.dir=='down')nm=1-nm;sc+=nm*m.w;tw+=m.w});
      var score=tw>0?Math.round(sc/tw*100):50;

      var cands=[];if(db.length&&lcB){cands=db.map(function(b){var bl=parseInt(b[lcB])||0,bd=b[dC]||1,bt=sv(b,tC),bv=sv(b,vC);
        return{l:bl,d:bd,tu:bt,va:bv,g:Math.abs(bd-di)}}).sort(function(a,b){return a.g-b.g}).slice(0,5)}

      return{lv:lv,tu:tu,va:va,di:di,co:co,re:re,rm:rm,ann:ann,adv:adv,score:score,ql:ql,cands:cands};
    });
    levels.sort(function(a,b){return a.lv-b.lv});
    levels.forEach(function(r){if(!repl[r.lv])repl[r.lv]={status:'pending',bLv:null}});
    render();document.getElementById('result').classList.add('show');
    document.getElementById('loading').classList.remove('show');
  },50);
}

function findLevelCol(d){var ks=Object.keys(d[0]||{});for(var i=0;i<['Level','LevelID'].length;i++)if(ks.indexOf(['Level','LevelID'][i])>=0)return ['Level','LevelID'][i];return null}
function findCol(d,cl){var ks=Object.keys(d[0]||{});for(var i=0;i<cl.length;i++)if(ks.indexOf(cl[i])>=0)return cl[i];return cl[0]}

// ─── render ───
function render(){
  var mt=+document.getElementById('max-turnover').value,md=+document.getElementById('max-difficulty').value;
  var mv=+document.getElementById('max-variance').value,tot=levels.length;
  var bySc=[].concat(levels).sort(function(a,b){return a.score-b.score});
  var bot=bySc.slice(0,20),done=levels.filter(function(r){return repl[r.lv].status=='done'});
  var skip=levels.filter(function(r){return repl[r.lv].status=='skip'});
  var used={},dupes=[];done.forEach(function(r){var b=repl[r.lv].bLv;if(b){used[b]=(used[b]||0)+1}});
  Object.keys(used).forEach(function(b){if(used[b]>1)dupes.push(b)});

  document.getElementById('summary').innerHTML=
    '<div class="summary-card"><h3>📋 A 集诊断</h3><div class="stats">总关数：<b>'+tot+'</b> · 已替换：<b>'+done.length+'</b> · 跳过：<b>'+skip.length+'</b><br>难度 <b>'+Math.min.apply(null,levels.map(function(r){return r.di})).toFixed(2)+'-'+Math.max.apply(null,levels.map(function(r){return r.di})).toFixed(2)+'</b> · 流失均值 <b>'+(levels.reduce(function(s,r){return s+r.tu},0)/tot).toFixed(2)+'%</b></div></div>'+
    '<div class="summary-card"><h3>📁 B 集</h3><div class="stats">'+(db.length?('总关数：<b>'+db.length+'</b><br>难度 <b>'+(Math.min.apply(null,db.map(function(d){return d['难度']||1})).toFixed(2)+'-'+Math.max.apply(null,db.map(function(d){return d['难度']||1})).toFixed(2))+'</b>'):'未上传，上传后可匹配候选')+'</div></div>';

  document.getElementById('sbar').innerHTML=
    '<div class="stat-item">最低质量 <b>'+bot[0].score+'</b> 分</div><div class="stat-item">最高质量 <b>'+bySc[bySc.length-1].score+'</b> 分</div>'+
    '<div class="stat-item">✅ 已替换 <b>'+done.length+'</b></div><div class="stat-item">⏭ 跳过 <b>'+skip.length+'</b></div>'+
    '<div class="stat-item">底线20均分 <b>'+(bot.reduce(function(s,r){return s+r.score},0)/bot.length).toFixed(0)+'</b></div>'+
    (dupes.length?'<div class="stat-item" style="color:#dc2626;">⚠ B重复替换 <b>'+dupes.length+'</b> 关(#'+dupes.join(',#')+')</div>':'');

  var fs=document.getElementById('f-status').value,rs=+document.getElementById('f-start').value||0;
  var re=+document.getElementById('f-end').value||9999,st=document.getElementById('f-search').value.trim();
  var rows=[].concat(levels);
  if(fs=='low')rows=bySc.slice(0,50);else if(fs=='done')rows=done;else if(fs=='skip')rows=skip;
  if(rs)rows=rows.filter(function(r){return r.lv>=rs});if(re<9999)rows=rows.filter(function(r){return r.lv<=re});
  if(st){var ns=st.split(',').map(function(s){return parseInt(s.trim())}).filter(function(n){return!isNaN(n)});if(ns.length)rows=rows.filter(function(r){return ns.indexOf(r.lv)>=0})}

  document.getElementById('tinfo').textContent='显示 '+rows.length+' / '+tot+' 关 · 按质量分升序';
  document.getElementById('thead').innerHTML='<th>Level</th><th>质量分</th><th>流失%</th><th>难度</th><th>变异</th><th>标注</th><th>进阶</th><th>B候选</th><th>操作</th>';

  document.getElementById('tbody').innerHTML=rows.map(function(r){
    var rp=repl[r.lv]||{status:'pending',bLv:null},sc=r.score;
    var sCls=sc<40?'c-red':sc<60?'c-amber':'c-green';
    var ann=r.ann.map(function(a){return'<span class="chip ch-red">'+a.l+'</span>'}).join(' ')||'—';
    var adv=r.adv.map(function(a){return'<span class="chip ch-amber">'+a+'</span>'}).join(' ')||'—';
    var ql=r.ql&&r.ql!='体验正常'?'<span class="chip ch-purple">'+r.ql+'</span>':'—';
    var cs=r.cands.map(function(c,i){var sel=(repl[r.lv]||{}).bLv==c.l;var bt=c.tu!==null?' 流失'+(c.tu||0).toFixed(1)+'%':'';return'<span class="candidate'+(i==0?' best':'')+(sel?' sel':'')+'" onclick="event.stopPropagation();sel('+r.lv+','+c.l+')">#'+c.l+'<small> 难度'+c.d.toFixed(2)+bt+'</small></span>'}).join(' ')||'—';
    return'<tr onclick="detail('+r.lv+')"><td><span class="lv-tag">Lv.'+r.lv+'</span></td>'+
      '<td class="r"><b class="'+sCls+'">'+sc+'</b></td>'+
      '<td class="r'+(r.tu>mt?' c-red':'')+'">'+(r.tu||0).toFixed(2)+'</td>'+
      '<td class="r'+(r.di>md?' c-amber':'')+'">'+r.di.toFixed(2)+'</td>'+
      '<td class="r'+((r.va||0)>mv?' c-amber':'')+'">'+(r.va||0).toFixed(3)+'</td>'+
      '<td>'+ann+'</td><td>'+adv+'</td><td>'+cs+'</td>'+
      '<td>'+(rp.status=='done'?'<span class="chip ch-green">已替换</span>':rp.status=='skip'?'<span class="chip ch-amber">已跳过</span>':'<button class="action-btn rp" onclick="event.stopPropagation();doRepl('+r.lv+')">替换</button><button class="action-btn sk" onclick="event.stopPropagation();doSkip('+r.lv+')">跳过</button>')+'</td></tr>';
  }).join('');

  document.getElementById('foot').innerHTML='<b>评分：</b>'+weights.map(function(m){return m.name+'('+(m.dir=='down'?'↓':'↑')+')'+m.w+'%'}).join(' · ')+' · 六维归一化加权，分数越高=综合质量越好。标注线仅用于高亮。紫色=SQL推断的数据特征，仅供参考。<br>替换后可用关卡数据分析工具 V3 验证效果。';
}

// ─── actions ───
function sel(lv,bl){repl[lv]={status:'pending',bLv:bl};render()}
function doRepl(lv){var r=repl[lv]||{};if(!r.bLv){var row=levels.find(function(x){return x.lv==lv});if(row&&row.cands.length)r.bLv=row.cands[0].l}r.status='done';render()}
function doSkip(lv){repl[lv].status='skip';render()}

function detail(lv){
  var r=levels.find(function(x){return x.lv==lv});if(!r)return;
  var p=document.getElementById('detail'),rp=repl[lv]||{};
  p.classList.add('show');document.getElementById('dt-title').textContent='Lv.'+lv+' · 质量分='+r.score+' · '+(rp.status=='done'?'已替换':'待处理');
  var ms=['流失率('+(r.tu||0).toFixed(2)+'%)','难度('+r.di.toFixed(2)+')','变异('+(r.va||0).toFixed(3)+')','人均消耗('+(r.co||0).toFixed(0)+')','复活转化('+(r.re!==null?(r.re*100).toFixed(1)+'%':'—')+')','失败剩余率('+(r.rm!==null?r.rm.toFixed(3):'—')+')'];
  var cs=r.cands.map(function(c,i){return'<span onclick="sel('+lv+','+c.l+');detail('+lv+')" style="cursor:pointer;margin:2px;padding:3px 8px;border:1px solid '+(rp.bLv==c.l?'var(--blue)':'var(--border)')+';border-radius:5px;font-size:11px;background:'+(rp.bLv==c.l?'var(--blue-light)':'#fff')+';">#'+c.l+'('+c.d.toFixed(2)+')'+(c.tu!==null?' 流失'+c.tu.toFixed(2)+'%':'')+'</span>'}).join('');
  document.getElementById('dt-grid').innerHTML=
    '<div><h4 style="margin-bottom:8px">A 集 Lv.'+lv+' 指标</h4>'+ms.map(function(m){return'<div class="m-row"><span class="m-label">'+m.split('(')[0]+'</span><span class="m-val">'+m.split('(')[1].replace(')','')+'</span></div>'}).join('')+
    (r.ann.length?'<div style="margin-top:8px;font-size:11px;color:var(--text-2)">标注：'+r.ann.map(function(a){return a.l}).join(', ')+'</div>':'')+
    (r.ql&&r.ql!='体验正常'?'<div style="margin-top:4px;font-size:11px;color:#6b21a8">数据质量：'+r.ql+'</div>':'')+'</div>'+
    '<div><h4 style="margin-bottom:8px">B 候选（难度匹配）</h4><div style="margin-bottom:10px">'+(cs||'—')+'</div>'+
    '<button class="action-btn rp" onclick="doRepl('+lv+');detail('+lv+')">替换</button> '+
    '<button class="action-btn sk" onclick="doSkip('+lv+');clsDetail()">跳过</button> '+
    '<button class="action-btn" onclick="repl['+lv+']={status:\'pending\',bLv:null};detail('+lv+')">撤回</button></div>';
}
function clsDetail(){document.getElementById('detail').classList.remove('show')}
document.addEventListener('keydown',function(e){if(e.key=='Escape')clsDetail()});

// ─── export ───
function expCSV(){
  var rows=[['A_Level','质量分','流失%','难度','变异','替换状态','B_Level','备注']];
  var probs=levels.filter(function(r){return r.ann.length||repl[r.lv].status!='pending'});
  (probs.length?probs:levels).forEach(function(r){var rp=repl[r.lv]||{};
    rows.push([r.lv,r.score,(r.tu||0).toFixed(2),r.di.toFixed(2),(r.va||0).toFixed(3),rp.status||'pending',rp.bLv||'',
      rp.status=='done'?'已替换':rp.status=='skip'?'跳过':'待处理'])});
  var csv=rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  var b=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='替换对照表_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
</script></body></html>
