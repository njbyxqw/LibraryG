<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的成长记录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .btn-active { background-color: #dbeafe !important; border-color: #93c5fd !important; }
        .tag-active { background-color: #dbeafe !important; border-color: #93c5fd !important; }
    </style>
</head>
<body class="bg-gray-50 max-w-2xl mx-auto p-4 font-sans pb-20">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center mt-2">🌱 我的成长记录</h1>

    <!-- 记录输入区 -->
    <div class="bg-white rounded-2xl shadow-sm p-5 mb-6">
        <!-- 情绪选择 -->
        <div class="mb-4">
            <p class="text-sm text-gray-600 mb-2">此刻情绪</p>
            <div class="flex gap-2 flex-wrap" id="emotion-selector">
                <button class="emotion-btn px-3 py-1.5 rounded-full border border-gray-200 text-sm hover:bg-gray-50 transition" data-value="😫烦躁">😫烦躁</button>
                <button class="emotion-btn px-3 py-1.5 rounded-full border border-gray-200 text-sm hover:bg-gray-50 transition" data-value="😔低落">😔低落</button>
                <button class="emotion-btn px-3 py-1.5 rounded-full border border-gray-200 text-sm hover:bg-gray-50 transition" data-value="😐平静">😐平静</button>
                <button class="emotion-btn px-3 py-1.5 rounded-full border border-gray-200 text-sm hover:bg-gray-50 transition" data-value="🙂开心">🙂开心</button>
                <button class="emotion-btn px-3 py-1.5 rounded-full border border-gray-200 text-sm hover:bg-gray-50 transition" data-value="🤩充实">🤩充实</button>
            </div>
        </div>

        <!-- 标签选择 -->
        <div class="mb-4">
            <p class="text-sm text-gray-600 mb-2">记录标签（可多选）</p>
            <div class="flex gap-2 flex-wrap" id="tag-selector">
                <button class="tag-btn px-3 py-1.5 rounded-full border border-gray-200 text-sm hover:bg-gray-50 transition" data-value="情绪疏导">#情绪疏导</button>
                <button class="tag-btn px-3 py-1.5 rounded-full border border-gray-200 text-sm hover:bg-gray-50 transition" data-value="职场碎悟">#职场碎悟</button>
                <button class="tag-btn px-3 py-1.5 rounded-full border border-gray-200 text-sm hover:bg-gray-50 transition" data-value="成长痕迹">#成长痕迹</button>
                <button class="tag-btn px-3 py-1.5 rounded-full border border-gray-200 text-sm hover:bg-gray-50 transition" data-value="困惑存根">#困惑存根</button>
                <button class="tag-btn px-3 py-1.5 rounded-full border border-gray-200 text-sm hover:bg-gray-50 transition" data-value="今日微光">#今日微光</button>
            </div>
        </div>

        <!-- 内容输入框 -->
        <textarea id="record-content" class="w-full h-36 border border-gray-200 rounded-xl p-3 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-200 text-gray-800 resize-none" placeholder="写下此刻的想法、情绪、困惑...不用讲逻辑，想到什么写什么"></textarea>

        <!-- 按钮区 -->
        <div class="flex gap-3">
            <button id="save-btn" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl hover:bg-blue-700 transition font-medium">保存记录</button>
            <button id="ai-analyze-btn" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl hover:bg-emerald-700 transition font-medium">AI帮我梳理</button>
        </div>

        <!-- AI结果展示区 -->
        <div id="ai-result" class="mt-4 p-4 bg-emerald-50 rounded-xl text-gray-700 text-sm leading-relaxed hidden"></div>
    </div>

    <!-- 历史记录区 -->
    <div>
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold text-gray-800">最近记录</h2>
            <span id="storage-tip" class="text-xs text-gray-500"></span>
        </div>
        <div id="record-list" class="space-y-4">
            <!-- 动态插入记录 -->
        </div>
    </div>

    <script>
        // ====================== 这里填你自己的配置就行！！ ======================
        const CONFIG = {
            // 👉 1. FlowUs相关配置：不想用云端同步就空着，自动存在本地浏览器
            FLOWUS_API_KEY: "", // 填你的FlowUs个人应用密钥
            FLOWUS_DATABASE_ID: "", // 填你建的记录数据库ID
            // 👉 2. 豆包AI配置：不想用AI功能可以先空着，后面再填
            DOUBAO_API_KEY: "api-key-20260715190606", // 填你的豆包开放平台API密钥
            DOUBAO_MODEL: "doubao-lite-4k", // 用这个模型就行，免费额度够，响应快
            // =====================================================================
            USE_LOCAL_STORAGE: false // 不用改，空着FlowUs配置自动启用本地存储
        }
        CONFIG.USE_LOCAL_STORAGE = !CONFIG.FLOWUS_API_KEY || !CONFIG.FLOWUS_DATABASE_ID;

        // 全局状态
        let selectedEmotion = '';
        let selectedTags = [];
        let currentAiResult = '';

        // 初始化：恢复草稿
        const contentEl = document.getElementById('record-content');
        contentEl.value = localStorage.getItem('record_draft') || '';
        contentEl.addEventListener('input', () => {
            localStorage.setItem('record_draft', contentEl.value);
        })

        // 存储模式提示
        document.getElementById('storage-tip').textContent = CONFIG.USE_LOCAL_STORAGE ? '🔹 本地存储模式（数据仅存在当前浏览器）' : '☁️ FlowUs云端同步模式';

        // 情绪选择交互
        document.querySelectorAll('.emotion-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.emotion-btn').forEach(b => b.classList.remove('btn-active'));
                btn.classList.add('btn-active');
                selectedEmotion = btn.dataset.value;
            })
        })

        // 标签选择交互
        document.querySelectorAll('.tag-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.toggle('tag-active');
                const tag = btn.dataset.value;
                if(selectedTags.includes(tag)) {
                    selectedTags = selectedTags.filter(t => t !== tag);
                } else {
                    selectedTags.push(tag);
                }
            })
        })

        // AI分析逻辑
        const aiResultEl = document.getElementById('ai-result');
        const aiBtn = document.getElementById('ai-analyze-btn');
        aiBtn.addEventListener('click', async () => {
            const content = contentEl.value.trim();
            if(!content) {
                alert('先写点内容再分析呀～');
                return;
            }
            if(!CONFIG.DOUBAO_API_KEY) {
                alert('请先在代码里填好豆包API密钥才能用AI功能哦');
                return;
            }

            aiBtn.disabled = true;
            aiBtn.textContent = '梳理中...';
            aiResultEl.classList.remove('hidden');
            aiResultEl.textContent = '正在帮你梳理思路，稍等几秒钟...';

            try {
                const res = await fetch('https://aquasearch.volces.com/api/v3/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.DOUBAO_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: CONFIG.DOUBAO_MODEL,
                        messages: [
                            {
                                role: 'system',
                                content: `你是我的专属成长陪伴者，严格遵守以下规则：
                                1. 绝对不评判我的情绪，不许说"你不该生气""你要乐观"这种话，第一句先共情我的感受；
                                2. 如果我写的是情绪内容：指出1个最具体的情绪触发点，给1个5分钟就能完成的超小缓解行动；
                                3. 如果我写的是职场/成长内容：帮我提炼成1条能直接用的行动准则；
                                4. 如果我写的是困惑：不要直接给标准答案，给3个引导我自己思考的问题；
                                5. 像朋友聊天一样说话，别书面化，总字数控制在200字以内，绝对不要灌鸡汤。`
                            },
                            {
                                role: 'user',
                                content: `我此刻的情绪：${selectedEmotion || '未填写'}，记录标签：${selectedTags.join('、') || '未填写'}，我的记录内容：${content}`
                            }
                        ],
                        temperature: 0.7
                    })
                })
                const data = await res.json();
                currentAiResult = data.choices[0].message.content;
                aiResultEl.textContent = currentAiResult;
            } catch (e) {
                aiResultEl.textContent = '分析失败了，检查下API密钥和网络哦';
                console.error(e);
            } finally {
                aiBtn.disabled = false;
                aiBtn.textContent = 'AI帮我梳理';
            }
        })

        // 保存记录逻辑
        const saveBtn = document.getElementById('save-btn');
        saveBtn.addEventListener('click', async () => {
            const content = contentEl.value.trim();
            if(!content) {
                alert('写点什么再保存呀～');
                return;
            }
            if(!selectedEmotion) {
                alert('选一下此刻的情绪吧～');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = '保存中...';
            const record = {
                id: Date.now().toString(),
                created_time: new Date().toISOString(),
                emotion: selectedEmotion,
                tags: [...selectedTags],
                content: content,
                ai_result: currentAiResult
            }

            try {
                if(CONFIG.USE_LOCAL_STORAGE) {
                    // 本地存储模式
                    const records = JSON.parse(localStorage.getItem('my_records') || '[]');
                    records.unshift(record);
                    localStorage.setItem('my_records', JSON.stringify(records));
                } else {
                    // FlowUs云端存储模式
                    await fetch('https://api.flowus.cn/api/v1/databases/records', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${CONFIG.FLOWUS_API_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            database_id: CONFIG.FLOWUS_DATABASE_ID,
                            properties: {
                                "情绪值": { select: { name: selectedEmotion } },
                                "标签": { multi_select: selectedTags.map(tag => ({name: tag})) },
                                "记录内容": { rich_text: [{text: {content: content}}] },
                                "AI分析结果": currentAiResult ? { rich_text: [{text: {content: currentAiResult}}] } : {}
                            }
                        })
                    })
                }

                // 保存成功后清空输入
                alert('保存成功✨');
                contentEl.value = '';
                localStorage.removeItem('record_draft');
                currentAiResult = '';
                aiResultEl.classList.add('hidden');
                document.querySelectorAll('.emotion-btn, .tag-btn').forEach(b => b.classList.remove('btn-active', 'tag-active'));
                selectedEmotion = '';
                selectedTags = [];
                loadRecords();
            } catch (e) {
                alert('保存失败，检查下FlowUs的API权限和密钥哦');
                console.error(e);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '保存记录';
            }
        })

        // 加载历史记录
        async function loadRecords() {
            const listEl = document.getElementById('record-list');
            listEl.innerHTML = '<p class="text-gray-500 text-center py-4">加载记录中...</p>';
            let records = [];

            try {
                if(CONFIG.USE_LOCAL_STORAGE) {
                    records = JSON.parse(localStorage.getItem('my_records') || '[]');
                } else {
                    const res = await fetch(`https://api.flowus.cn/api/v1/databases/${CONFIG.FLOWUS_DATABASE_ID}/records?page_size=20`, {
                        headers: { 'Authorization': `Bearer ${CONFIG.FLOWUS_API_KEY}` }
                    });
                    const data = await res.json();
                    records = data.records.map(r => ({
                        id: r.id,
                        created_time: r.created_time,
                        emotion: r.properties['情绪值'].select?.name || '',
                        tags: r.properties['标签'].multi_select?.map(t => t.name) || [],
                        content: r.properties['记录内容'].rich_text?.map(t => t.text.content).join('') || '',
                        ai_result: r.properties['AI分析结果'].rich_text?.map(t => t.text.content).join('') || ''
                    })).sort((a,b) => new Date(b.created_time) - new Date(a.created_time));
                }

                if(records.length === 0) {
                    listEl.innerHTML = '<p class="text-gray-400 text-center py-8">还没有记录，写下第一条吧～</p>';
                    return;
                }

                listEl.innerHTML = '';
                records.forEach(record => {
                    const item = document.createElement('div');
                    item.className = 'bg-white rounded-2xl shadow-sm p-4';
                    const date = new Date(record.created_time).toLocaleString('zh-CN', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
                    const tags = record.tags.map(t => `<span class="text-blue-600 text-xs mr-2">#${t}</span>`).join('');
                    const aiBlock = record.ai_result ? `<div class="mt-3 p-3 bg-emerald-50 rounded-lg text-sm text-gray-700 leading-relaxed">💡 ${record.ai_result}</div>` : '';

                    item.innerHTML = `
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm text-gray-500">${date}</span>
                            <span class="text-lg">${record.emotion}</span>
                        </div>
                        <div class="mb-2">${tags}</div>
                        <p class="text-gray-800 leading-relaxed whitespace-pre-wrap">${record.content}</p>
                        ${aiBlock}
                    `;
                    listEl.appendChild(item);
                })
            } catch (e) {
                listEl.innerHTML = '<p class="text-gray-500 text-center py-4">记录加载失败，检查网络和配置哦</p>';
                console.error(e);
            }
        }

        // 页面打开自动加载记录
        loadRecords();
    </script>
</body>
</html>
